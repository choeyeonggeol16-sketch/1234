# UTF-8; -D properties override this file. Restart after changes.
# Identity enforcement requires an existing trusted client/provider binding.
# It does NOT derive a PC identity from an IP/account and does not use a DB.
ctransport.macLimit=0
ctransport.perf.intervalMs=1000
ctransport.loginTimeoutMs=60000
ctransport.diagnostics.enabled=true
ctransport.diagnostics.maxConnections=10000
