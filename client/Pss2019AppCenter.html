<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RKern 앱센터 연결 시험</title>
<style>
html,body{padding:0;margin:0;background:#171614;color:#eee5d5;font-family:"Malgun Gothic",Dotum,Arial,sans-serif;font-size:13px}
.wrap{margin:20px auto 30px;width:92%;max-width:640px;border:1px solid #504635;background:#24221f}
.bar{padding:13px 17px;border-bottom:1px solid #51432d;background:#34302a;color:#dec18b;font-size:15px;font-weight:bold}
.inner{padding:26px 20px;text-align:center}
.check{display:inline-block;border:1px solid #a1844d;background:#45351b;color:#f8d58d;padding:8px 18px;font-size:18px;font-weight:bold}
h1{font-size:22px;color:#f1d59f;margin:20px 0 8px}
p{line-height:1.8;color:#cfcbc2}
.menu{margin:24px auto 0;max-width:430px}
.box{display:inline-block;vertical-align:top;margin:6px;padding:14px 12px;width:95px;height:52px;border:1px solid #685942;background:#332d25;color:#d8c5a5}
small{display:block;color:#918b82;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
 <div class="bar">RKern · 2019 클라이언트 앱센터</div>
 <div class="inner">
  <div class="check">연결 시험</div>
  <h1>앱센터 연결 성공</h1>
  <p>기존 Ctrl+Z 웹뷰에서 사용자 지정 페이지를 표시했습니다.<br>이 페이지는 로컬 테스트용이며 서버 API 연결 전입니다.</p>
  <div class="menu">
   <div class="box">시세<br><small>준비 중</small></div>
   <div class="box">캐릭터 랭킹<br><small>준비 중</small></div>
   <div class="box">캐릭터 검색<br><small>준비 중</small></div>
   <div class="box">게시판<br><small>준비 중</small></div>
  </div>
  <small>PSS · 게임 서버 · 클라이언트 인증은 변경하지 않았습니다.</small>
 </div>
</div>
</body>
</html>
