    required uint32 enchant = 1;
    optional uint32 fr = 2;
    optional uint32 wr = 3;
    optional uint32 ar = 4;
    optional uint32 er = 5;
  }
  required uint32 type = 1;
  repeated .LIN.ArmorElementalEnchantBonus.EnchantBonus enchant_bonus_list = 2;
}

message MapList {
  enum eWorldType {
    Main = 1;
    Battle = 2;
    Arena = 3;
    Dungeon = 4;
  }
  message MapInfoT {
    required uint32 Number = 1;
    required .LIN.MapList.eWorldType WorldType = 2;
    optional uint32 CopyStartNumber = 3;
    optional uint32 CopyCount = 4 [default = 1];
    optional bool IsUnderground = 5;
    optional bool IsNPCForbidden = 6;
    optional bool IsDogAllowed = 7;
    optional bool IsSafeWorld = 8;
    optional uint32 GroupID = 9;
    optional string NativeScript = 10;
    optional bool IsNoItemUse = 11 [default = false];
    optional bool IsNoSpellUse = 12 [default = false];
    optional uint32 dmgModiPc2Npc = 13 [default = 100];
    optional uint32 dmgModiNpc2Pc = 14 [default = 100];
    optional bool equipChange = 15 [default = true];
    optional bool forceLoad = 16 [default = false];
    optional .LIN.RegionT GhostRegion = 17;
    optional int32 contentEndKillAllNpc_ik = 18 [default = 0];
    optional string LuaScript = 19;
    optional bool UITeleport = 20 [default = false];
  }
  message MapGroupT {
    repeated .LIN.MapList.MapInfoT Map = 1;
  }
  repeated .LIN.MapList.MapInfoT Map = 1;
  repeated .LIN.MapList.MapGroupT MapGroup = 2;
}

message AutoHuntHelperNPCInfo {
  message NPC {
    enum eCategory {
      Checker = 1;
      Merchant = 2;
      Teleporter = 3;
      Restorer = 4;
      Cook = 5;
      BuffShop = 6;
    }
    required .LIN.AutoHuntHelperNPCInfo.NPC.eCategory category = 1;
    required int32 world_number = 2;
    required int32 loc_x = 3;
    required int32 loc_y = 4;
    optional string desc = 5;
    optional int32 entermap_id = 6;
    optional int32 lev = 7;
  }
  repeated .LIN.AutoHuntHelperNPCInfo.NPC npc_list = 1;
}

message CompanionT {
  enum eStatType {
    STR = 0;
    CON = 1;
    INT_ = 2;
  }
  enum eCommand {
    TM_Aggressive = 2;
    TM_Defensive = 3;
    TM_GetItem = 6;
    TM_Attack = 7;
    TM_PullBack = 9;
    Dismiss = 100;
    Joke = 101;
    Happy = 102;
  }
  enum eCategory {
    FIERCE_ANIMAL = 1;
    DEVINE_BEAST = 2;
    PET = 3;
    WILD = 4;
    DOG_FIGHT = 5;
  }
  enum eElement {
    NONE = 0;
    FIRE = 1;
    WATER = 2;
    AIR = 3;
    EARTH = 4;
    LIGHT = 5;
  }
  message StatT {
    message BaseStatBonusT {
      required int32 id = 1;
      required .LIN.CompanionT.eStatType statType = 2;
      required int32 value = 3;
      optional int32 meleeDmg = 4;
      optional int32 meleeHit = 5;
      optional int32 regenHP = 6;
      optional int32 AC = 7;
      optional int32 spellDmg = 8;
      optional int32 spellHit = 9;
    }
    repeated .LIN.CompanionT.StatT.BaseStatBonusT BaseStatBonus = 1;
  }
  message SkillEnchantTierT {
    message EnchantCostT {
      repeated uint32 friendship = 1;
      optional uint32 catalystItem = 2;
    }
    message OpenCostT {
      required uint32 level = 1;
      optional uint32 minEnchant = 2;
      optional uint32 friendship = 3;
      optional uint32 adena = 4;
    }
    required uint32 tier = 1;
    required .LIN.CompanionT.SkillEnchantTierT.EnchantCostT EnchantCost = 2;
    required .LIN.CompanionT.SkillEnchantTierT.OpenCostT OpenCost = 3;
  }
  message WildSkillT {
    message SkillT {
      message EnchantBonusT {
        required int32 value = 1;
        optional int32 meleeDmg = 2;
        optional int32 meleeHit = 3;
        optional double meleeCriHit = 4;
        optional int32 ignoreReduction = 5;
        optional double bloodSuckHit = 6;
        optional int32 bloodSuckHeal = 7;
        optional int32 regenHP = 8;
        optional int32 AC = 9;
        optional int32 MR = 10;
        optional int32 potionHP = 11;
        optional int32 dmgReduction = 12;
        optional int32 maxHP = 13;
        optional int32 spellDmgMulti = 14;
        optional int32 spellHit = 15;
        optional double moveDelayReduce = 16;
        optional double attackDelayReduce = 17;
        optional int32 fireElementalDmg = 18;
        optional int32 waterElementalDmg = 19;
        optional int32 airElementalDmg = 20;
        optional int32 earthElementalDmg = 21;
        optional int32 lightElementalDmg = 22;
        optional int32 comboDmgMulti = 23;
        optional int32 spellDmgAdd = 24;
      }
      required int32 id = 1;
      required int32 descNum = 2;
      repeated .LIN.CompanionT.WildSkillT.SkillT.EnchantBonusT EnchantBonus = 3;
    }
    repeated .LIN.CompanionT.WildSkillT.SkillT Skill = 1;
  }
  message ClassInfoT {
    message ClassT {
      message SkillT {
        required uint32 tier = 1;
        repeated uint32 skillId = 2;
      }
      required string class = 1;
      required uint32 classId = 2;
      required .LIN.CompanionT.eCategory category = 3;
      required .LIN.CompanionT.eElement element = 5;
      repeated .LIN.CompanionT.ClassInfoT.ClassT.SkillT Skill = 6;
    }
    repeated .LIN.CompanionT.ClassInfoT.ClassT Class = 1;
  }
}

message Point {
  required uint32 x = 1;
  required uint32 y = 2;
}

message MasteryUnitT {
  message SlotEnchantT {
    required int32 slot_id = 1;
    required int32 enchant = 2;
  }
  message RouletteSlotT {
    required int32 slot_id = 1;
    required int32 bonus_id = 2;
  }
  required int32 weapon_type = 1;
  optional int32 mastery_point = 2;
  repeated .LIN.MasteryUnitT.SlotEnchantT slot_enchant_info = 3;
  repeated .LIN.MasteryUnitT.RouletteSlotT roulette_slot_info = 4;
}

message MasteryGaugeT {
  required int32 gauge = 1;
  optional int64 last_charge_unix_time = 2;
}

message WeaponMasteryT {
  repeated .LIN.MasteryUnitT mastery_unit = 1;
}

message XmlMasteryUnitT {
  message XmlEnchantBonusT {
    optional int32 bonusId = 1;
    required .LIN.Bonus BonusOption = 2;
  }
  message XmlInputItemT {
    required int32 nameId = 1;
    required int32 count = 2;
    required int32 inputSlot = 3;
  }
  message XmlMasterySlotT {
    message XmlEnchantInfoT {
      required int32 enchantValue = 1;
      required int32 inputMasteryCost = 2;
      repeated .LIN.XmlMasteryUnitT.XmlInputItemT InputItem = 3;
      required .LIN.XmlMasteryUnitT.XmlEnchantBonusT EnchantBonus = 4;
    }
    required int32 slotId = 1;
    required int32 slotOpeningCost = 2;
    required int32 slotOpeningLevel = 3;
    optional int32 slotOpeningPrevEnchant = 4;
    required int32 slotEnchantLimit = 5;
    repeated .LIN.XmlMasteryUnitT.XmlMasterySlotT.XmlEnchantInfoT SlotEnchantInfo = 6;
  }
  message XmlRouletteSlotInfoT {
    message XmlRouletteSlotT {
      required int32 slotId = 1;
      required int32 slotOpeningMasteryEnchant = 2;
      required int32 slotOpeningCost = 3;
      repeated .LIN.XmlMasteryUnitT.XmlEnchantBonusT RouletteBonus = 4;
    }
    required int32 inputMasteryCost = 1;
    repeated .LIN.XmlMasteryUnitT.XmlInputItemT InputItem = 2;
    repeated .LIN.XmlMasteryUnitT.XmlRouletteSlotInfoT.XmlRouletteSlotT RouletteSlot = 3;
  }
  required .LIN.ExtendedWeaponType weaponType = 1;
  repeated uint32 availableClass = 2;
  repeated .LIN.XmlMasteryUnitT.XmlMasterySlotT MasterySlot = 3;
  required .LIN.XmlMasteryUnitT.XmlRouletteSlotInfoT RouletteSlotInfo = 4;
}

