message MonsterBookV2Info {
  message SystemT {
    message RewardT {
      message ItemRewardT {
        required int32 item_name_id = 1;
        required uint32 amount = 2;
      }
      required .LIN.eMonsterBookV2RewardGrade grade = 1;
      required int32 reward_exp = 2;
      optional int32 item_name_id = 3;
      repeated .LIN.MonsterBookV2Info.SystemT.RewardT.ItemRewardT item_rewards = 4;
      optional uint32 high_level = 5;
      optional uint32 high_reward_exp = 6;
    }
    message BonusRewardT {
      required .LIN.eMonsterBookV2BonusRewardGrade grade = 1;
      required int32 reward_exp = 2;
      required int32 item_name_id = 3;
    }
    message GradeRewardT {
      message ItemT {
        required int32 NameID = 1;
        required int32 Count = 2;
      }
      message LevelT {
        optional int32 MinLevel = 1;
        optional int32 MaxLevel = 2;
      }
      message ExpT {
        required int32 AbsolValue = 1;
      }
      message ConditionsT {
        repeated .LIN.MonsterBookV2Info.SystemT.GradeRewardT.ItemT Item = 1;
        repeated .LIN.MonsterBookV2Info.SystemT.GradeRewardT.LevelT Level = 2;
      }
      message RewardsT {
        repeated .LIN.MonsterBookV2Info.SystemT.GradeRewardT.ItemT Item = 1;
        repeated .LIN.MonsterBookV2Info.SystemT.GradeRewardT.ExpT Exp = 2;
      }
      message ConditionRewardSetT {
        optional .LIN.MonsterBookV2Info.SystemT.GradeRewardT.ConditionsT Conditions = 1;
        required .LIN.MonsterBookV2Info.SystemT.GradeRewardT.RewardsT Rewards = 2;
      }
      message ConditionalRewardT {
        required int32 ID = 1;
        required .LIN.eMonsterBookV2RewardType Type = 2;
        optional .LIN.eMonsterBookV2RewardConnective Connective = 3;
        repeated .LIN.MonsterBookV2Info.SystemT.GradeRewardT.ConditionRewardSetT Set = 4;
      }
      message ConditionalRewardsT {
        repeated .LIN.MonsterBookV2Info.SystemT.GradeRewardT.ConditionalRewardT ConditionalReward = 1;
        optional int32 UsedItemID = 2;
      }
      required .LIN.eMonsterBookV2RewardGrade grade = 1;
      required .LIN.MonsterBookV2Info.SystemT.GradeRewardT.ConditionalRewardsT rewards = 2;
    }
    repeated .LIN.MonsterBookV2Info.SystemT.RewardT rewards = 2;
    repeated .LIN.MonsterBookV2Info.SystemT.BonusRewardT bonus_rewards = 3;
    required uint32 min_level = 4;
    repeated .LIN.MonsterBookV2Info.SystemT.GradeRewardT grade_reward = 5;
  }
  message DeckT {
    message CardT {
      required uint32 index = 1;
      required uint32 required_amount = 2;
      required uint32 achievement_id = 3;
      required uint32 criteria_id = 4;
      required uint32 amount = 5;
    }
    required uint32 index = 1;
    required .LIN.eMonsterBookV2DeckState state = 3;
    repeated .LIN.MonsterBookV2Info.DeckT.CardT cards = 4;
  }
  required .LIN.MonsterBookV2Info.SystemT system = 1;
  repeated .LIN.MonsterBookV2Info.DeckT decks = 2;
}

