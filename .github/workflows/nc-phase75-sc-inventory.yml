name: 'Phase75 complete SC packet inventory from pinned phase74'
on:
  push:
    branches: [nc-assemble-broadcast-phase75-all-sc-20261116]
    paths:
      - '.github/workflows/nc-phase75-sc-inventory.yml'
      - 'patches/nc_assemble_broadcast_phase75_20261116/inventory.py'\n      - 'patches/nc_assemble_broadcast_phase75_20261116/extract.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Inventory every SC packet and broadcast route
        run: python patches/nc_assemble_broadcast_phase75_20261116/inventory.py
      - name: Extract exact SC sources for next conversion\n        run: python patches/nc_assemble_broadcast_phase75_20261116/extract.py\n      - name: Publish full SC audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f patches/nc_assemble_broadcast_phase75_20261116/inventory.json\n          git add -f reports/nc_phase75_inspect/*.java
          git diff --cached --quiet && exit 0
          git commit -m 'Publish full SC broadcast migration inventory [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
