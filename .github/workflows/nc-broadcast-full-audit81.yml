name: 'Audit81 full phase80 SC and Native broadcast life-cycle'
on:
  push:
    branches: [nc-broadcast-full-regression-audit81-20261116]
    paths:
      - ".github/workflows/nc-broadcast-full-audit81.yml"
      - "patches/nc_broadcast_full_audit81_20261116/audit.py"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Scan all Java and native C++ from the SHA-pinned phase80 full SRC
        run: python3 patches/nc_broadcast_full_audit81_20261116/audit.py
      - name: Publish source-located audit evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/nc_broadcast_full_audit81
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish full SC broadcast source audit [skip ci]'
          for retry in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep 1
          done
          exit 1
