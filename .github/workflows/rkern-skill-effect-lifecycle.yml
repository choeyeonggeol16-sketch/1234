name: RKern skill effect lifecycle checks

on:
  push:
    branches:
      - rkern/unified-jproring-game-20261120
      - rkern/skill-effect-wip-20261121
      - rkern/poison-effect-lifecycle-20261121
    paths:
      - .github/workflows/rkern-skill-effect-lifecycle.yml
      - rkern/src/l1j/server/server/model/character/skill/**
      - rkern/src/l1j/server/server/model/character/login/skill/**
      - rkern/src/l1j/server/server/model/character/effect/PcPassiveEffects.java
      - rkern/src/l1j/server/server/model/Ability.java
      - rkern/src/l1j/server/server/model/Resistance.java
      - rkern/src/l1j/server/server/model/L1Character.java
      - rkern/src/l1j/server/server/model/L1EquipmentSlot.java
      - rkern/src/l1j/server/server/model/L1WeaponSkill.java
      - rkern/src/l1j/server/server/model/character/effect/paralysis/**
      - rkern/src/l1j/server/server/SingleTask.java
      - rkern/src/l1j/server/server/model/character/effect/poison/**
      - rkern/src/l1j/server/server/model/poison/**
      - rkern/src/l1j/server/server/model/HelpBySupport.java
      - rkern/src/l1j/server/server/model/Instance/L1PcInstance.java
      - rkern/src/l1j/server/server/model/Instance/L1NpcInstance.java
      - rkern/src/l1j/server/server/model/item/function/GreenPotion.java
      - rkern/src/l1j/server/server/model/item/function/MovementPotionEffects.java
      - rkern/src/l1j/server/server/model/item/function/BravePotion.java
      - rkern/src/l1j/server/server/model/item/function/CrownAreaStunItemEffect.java
      - rkern/src/l1j/server/server/model/item/function/PotentialSkillConsumable.java
      - rkern/src/l1j/server/server/utils/CommonUtil.java
      - rkern/src/l1j/server/server/model/network/core/sc/packet/SC_OwnCharStatus.java
      - rkern/docs/skill_effect_lifecycle_20261120/BenchmarkSkillEffectLifecycle.java
      - rkern/docs/skill_effect_lifecycle_20261120/TestSkillEffectLifecycle.java
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            rkern/src
            rkern/docs/jproring_cio_integration_20261120
            rkern/docs/skill_effect_lifecycle_20261120
            rkern/docs/poison_effect_20261121
      - name: Cache skill regression dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/rkern-skill-deps
          key: rkern-skill-jars-v1
      - name: Compile all production Java and run skill lifecycle regression
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          java -version
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import subprocess
          import time
          import urllib.error

          root = Path("rkern").resolve()
          work = Path(os.environ["RUNNER_TEMP"]) / "skill-lifecycle"
          classes = work / "classes"
          classes.mkdir(parents=True, exist_ok=True)
          helper_path = root / "docs/jproring_cio_integration_20261120/run_game_ab.py"
          spec = importlib.util.spec_from_file_location("rkern_build_helper", helper_path)
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          # Shared Maven Central can rate-limit ephemeral GitHub runner IPs.
          # Reuse cached jars and retry only transient HTTP failures.
          deps = Path.home() / ".cache/rkern-skill-deps"
          for attempt in range(6):
              try:
                  cp = helper.classpath(classes, deps)
                  break
              except urllib.error.HTTPError as failure:
                  if failure.code not in (429, 500, 502, 503, 504) or attempt == 5:
                      raise
                  delay = min(4 * (attempt + 1), 20)
                  print(f"Maven download HTTP {failure.code}; retry in {delay}s", flush=True)
                  time.sleep(delay)
          sources = sorted((root / "src").rglob("*.java"))
          print(f"Production Java files: {len(sources)}", flush=True)
          sources.append(root / "docs/skill_effect_lifecycle_20261120/TestSkillEffectLifecycle.java")
          sources.append(root / "docs/skill_effect_lifecycle_20261120/BenchmarkSkillEffectLifecycle.java")
          sources.append(root / "docs/poison_effect_20261121/TestPoisonEffectLifecycle.java")
          sources.append(root / "docs/poison_effect_20261121/TestCurseParalysisLifecycle.java")
          args = work / "sources.txt"
          args.write_text("".join('"' + str(p) + '"\n' for p in sources), encoding="utf-8")
          subprocess.run(["javac", "-J-Xmx2g", "-encoding", "UTF-8", "-source", "21",
                          "-target", "21", "--enable-preview", "-cp", cp, "-d",
                          str(classes), "@" + str(args)], check=True, timeout=300)
          print("PASS full production Java and regression compilation", flush=True)
          subprocess.run(["java", "--enable-preview", "-Xms128m", "-Xmx768m",
                          "-XX:ActiveProcessorCount=2", "-cp", cp,
                          "l1j.server.server.model.character.skill.TestSkillEffectLifecycle"],
                         cwd=work, check=True, timeout=120)
          print("PASS skill lifecycle test process", flush=True)
          subprocess.run(["java", "--enable-preview", "-Xms128m", "-Xmx768m",
                          "-XX:ActiveProcessorCount=2", "-cp", cp,
                          "l1j.server.server.model.character.effect.poison.TestPoisonEffectLifecycle"],
                         cwd=work, check=True, timeout=60)
          print("PASS poison lifecycle regression", flush=True)
          subprocess.run(["java", "--enable-preview", "-Xms128m", "-Xmx768m",
                          "-XX:ActiveProcessorCount=2", "-cp", cp,
                          "l1j.server.server.model.TestCurseParalysisLifecycle"],
                         cwd=work, check=True, timeout=60)
          print("PASS curse paralysis lifecycle regression", flush=True)
          PY
