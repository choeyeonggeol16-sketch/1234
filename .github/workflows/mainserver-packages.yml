name: MainServer protocol package migration
on:
  push:
    branches:
      - mainserver-package-20261115
    paths:
      - .github/workflows/mainserver-packages.yml
      - patches/mainserver_packages_20261115/**
permissions:
  contents: write
jobs:
  refactor-and-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify latest source and migrate all MainServer Java packages
        run: |
          python3 patches/mainserver_packages_20261115/refactor_packages.py --work "$RUNNER_TEMP/mainserver"
      - name: Fetch pinned Java 21 compile dependencies with SHA-256 verification
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          records = json.loads(pathlib.Path('patches/mainserver_protocol_20261114/logs/dependencies.json').read_text())
          root = pathlib.Path('.compile-deps')
          root.mkdir(exist_ok=True)
          for dep in records:
              dst = root / dep['file']
              urllib.request.urlretrieve(dep['url'], dst)
              digest = hashlib.sha256(dst.read_bytes()).hexdigest()
              if digest != dep['sha256']:
                  raise RuntimeError(f"Dependency SHA256 mismatch: {dst.name}")
          print(f"Verified {len(records)} pinned dependencies")
          PY
      - name: Compile every production Java 21 source using migrated packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mainserver/classes"
          find "$RUNNER_TEMP/mainserver/src" -name '*.java' | sort > "$RUNNER_TEMP/mainserver/sources.txt"
          echo "Java files: $(wc -l < "$RUNNER_TEMP/mainserver/sources.txt")"
          javac --enable-preview --release 21 -encoding UTF-8 -J-Xmx5g \
            -cp "$(pwd)/.compile-deps/*" \
            -d "$RUNNER_TEMP/mainserver/classes" @"$RUNNER_TEMP/mainserver/sources.txt"
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"]) / 'mainserver'
          d=json.loads((root/'packages-validation.json').read_text())
          assert d['source_java']==1711 and d['moved_java'] >= 90
          z=zipfile.ZipFile('downloads/CTransport_MainServer_Packages_FULL_SRC_20261115.zip')
          assert z.testzip() is None
          print(f"Compilation complete; migrated={d['moved_java']}, edited={d['edited_java']}, archive verified")
          PY
      - name: Publish single validated full source ZIP on this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/CTransport_MainServer_Packages_FULL_SRC_20261115.zip
          git diff --cached --quiet && { echo "Already published"; exit 0; }
          git commit -m "Publish compiled MainServer package-grouped full source [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
