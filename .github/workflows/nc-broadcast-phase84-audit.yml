name: "Phase84 audit remaining 81-source legacy broadcasts"
on:
  push:
    branches: [nc-broadcast-legacy-removal-phase84-20261116]
    paths:
      - ".github/workflows/nc-broadcast-phase84-audit.yml"
      - "patches/nc_broadcast_phase84_20261116/inventory.py"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Inventory complete pinned 81 source and extract old call AST shapes
        run: python3 patches/nc_broadcast_phase84_20261116/inventory.py
      - name: Commit exact source contexts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f reports/nc_phase84_legacy_context
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inventory 81 full SRC legacy broadcast calls [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
