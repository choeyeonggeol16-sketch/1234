name: Phase78 inspect WriteBuffer external ByteBuffer semantics
on:
  push:
    branches: [nc-assemble-broadcast-phase78-20261116]
    paths:
      - ".github/workflows/nc-phase78-preflight.yml"
      - "patches/nc_assemble_broadcast_phase78_20261116/inspect_writebuffer.py"
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 patches/nc_assemble_broadcast_phase78_20261116/inspect_writebuffer.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/nc_phase78_preflight
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Inspect pinned phase77 WorldPut and external WriteBuffer [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
