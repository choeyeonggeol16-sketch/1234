name: Broadcast phase66 legacy class inventory
on:
  push:
    branches: [broadcast-nonsc-phase66-legacy-removal-20261116]
    paths:
      - ".github/workflows/broadcast-nonsc-phase66.yml"
      - "patches/broadcast_nonsc_phase66_20261116/**"
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Inventory all original Java sources before any deletion
        run: python3 patches/broadcast_nonsc_phase66_20261116/scan_legacy.py
      - name: Publish inventory evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/broadcast_nonsc_phase66_20261116
          git diff --cached --quiet && exit 0
          git commit -m "Record exact legacy broadcast class and method inventory [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
