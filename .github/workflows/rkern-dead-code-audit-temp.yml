name: RKern temporary unused-source audit
on:
  push:
    branches:
      - rkern/nc-intrusive-inventory-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 15
      - name: Scan production Java references and runtime data
        shell: bash
        run: |
          python3 - <<'PY' | tee dead-code-audit.txt
          from pathlib import Path
          from collections import defaultdict
          import re
          root=Path("rkern")
          production=list((root/"src").rglob("*.java"))
          byname=defaultdict(list)
          for p in production: byname[p.stem].append(p)
          names=set(byname)
          references=defaultdict(set)
          src_sizes={}
          accepted={".java",".xml",".properties",".conf",".cfg",".ini",".json",".yml",".yaml",".sql",".txt",".js",".html",".htm",".csv"}
          files=[]
          for base in ["src","data","config","resources","sql","db","settings"]:
              folder=root/base
              if not folder.exists():continue
              files.extend(p for p in folder.rglob("*") if p.is_file() and p.suffix.lower() in accepted)
          rx=re.compile(r"\b[\w$]+\b")
          for p in files:
              if p.stat().st_size>20_000_000:continue
              try: text=p.read_text(encoding="utf-8",errors="replace")
              except OSError:continue
              path=str(p)
              for word in set(rx.findall(text)).intersection(names):
                  references[word].add(path)
              if p.suffix==".java":src_sizes[path]=len(text.splitlines())
          print(f"Total production Java files: {len(production)}; scanned files: {len(files)}")
          print("Exact simple-identifier references outside defining file(s):")
          candidates=[]
          for name, paths in byname.items():
              owners=set(map(str,paths))
              others=references[name]-owners
              if len(others)==0 and len(paths)==1:
                  candidates.append((name,str(paths[0]),src_sizes.get(str(paths[0]),0)))
          candidates.sort(key=lambda x:(-x[2],x[0]))
          print(f"ZERO_EXTERNAL_REFERENCES: {len(candidates)}")
          for name,path,lines in candidates:
              print(f"ZERO | {lines:5d} | {path}")
          print("END_ZERO")
          print("Specific obsolete tokens, references across scanned source:")
          for name in ["L1BossCycle","L1BossSpawn","INIT_BOSS_SPAWN","InitBossSpawn"]:
              print(name,sorted(references.get(name,set())))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify deleted class references and parse every Java 21 source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          base="576b7670b5f470450a6574e092bd14fad5c6282a"
          removed=[x for x in subprocess.check_output(["git","diff","--name-only","--diff-filter=D",base,"HEAD","--","rkern/src"],text=True).splitlines() if x.endswith(".java")]
          names=sorted({Path(x).stem for x in removed})
          rx=re.compile(r"\b(?:"+"|".join(map(re.escape,names))+r")\b") if names else None
          refs=[]
          for p in Path("rkern/src").rglob("*.java"):
              text=p.read_text(encoding="utf-8",errors="replace")
              if rx:
                  for name in set(rx.findall(text)):refs.append((name,str(p)))
          print("Deleted source files:",len(removed),"remaining references:",len(refs))
          for name,path in refs[:30]:print("STALE:",name,path)
          assert len(removed)>=47, "Expected deletions were not detected"
          assert not refs, "Deleted Java class still referenced"
          assert Path("rkern/src/l1j/server/server/Controller/BossController.java").is_file()
          PY
          cat >/tmp/ParseAll.java <<'JAVA'
          import java.nio.file.*;
          import java.nio.charset.*;
          import java.util.*;
          import javax.tools.*;
          import com.sun.source.util.JavacTask;
          public class ParseAll {
            public static void main(String[] args) throws Exception {
              List<Path> paths;
              try (var st=Files.walk(Path.of("rkern/src"))) {
                paths=st.filter(p->p.toString().endsWith(".java")).toList();
              }
              var compiler=ToolProvider.getSystemJavaCompiler();
              var diagnostics=new DiagnosticCollector<JavaFileObject>();
              try (var fm=compiler.getStandardFileManager(diagnostics,null,StandardCharsets.UTF_8)) {
                var units=fm.getJavaFileObjectsFromPaths(paths);
                var task=(JavacTask)compiler.getTask(null,fm,diagnostics,
                    List.of("-proc:none","--release","21"),null,units);
                int parsed=0;
                for(var tree:task.parse())parsed++;
                long errors=diagnostics.getDiagnostics().stream().filter(d->d.getKind()==Diagnostic.Kind.ERROR).count();
                for(var d:diagnostics.getDiagnostics())if(d.getKind()==Diagnostic.Kind.ERROR)System.out.println(d);
                System.out.println("JDK21 syntax parsed="+parsed+" errors="+errors);
                if(errors>0 || parsed!=paths.size())System.exit(2);
              }
            }
          }
          JAVA
          javac /tmp/ParseAll.java
          java -Xmx3g -cp /tmp ParseAll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rkern-dead-code-audit
          path: dead-code-audit.txt
          retention-days: 1
