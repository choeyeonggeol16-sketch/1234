name: Phase71 NC original direct refcounted CIOBufferEx slab (no per-broadcast wrapper)
on:
  push:
    branches: [nc-direct-slab-phase71-20261116]
    paths:
      - ".github/workflows/nc-direct-slab-phase71-build.yml"
      - "patches/nc_direct_slab_phase71_20261116/migrate.py"
permissions:
  contents: write
jobs:
  msbuild_javac_real_iocp:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Prepare phase70 native assembler and patch slab-based source ownership
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python patches/nc_direct_slab_phase71_20261116/migrate.py "$env:RUNNER_TEMP\nc-direct-slab-phase71" prepare
          if($LASTEXITCODE -ne 0){throw 'prepare failed'}
      - name: Build MSVC x64 CTransport.dll with direct CIOBufferEx slab source (ABI11)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'nc-direct-slab-phase71'
          Push-Location $root
          try {
            python native/build_native_msvc.py
            if($LASTEXITCODE -ne 0){throw 'MSVC native pooled packet build failed'}
            Copy-Item -Force "$root\build\CTransport.dll" "$root\CTransport.dll"
            & "$root\build\CTransport_SelfTest.exe"
            if($LASTEXITCODE -ne 0){throw 'native loopback selftest failed'}
          } finally { Pop-Location }
      - name: Use actual Windows IOCP shared SEND fixture for action and movement
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python patches/nc_pooled_phase69_20261116/prepare_windows_test.py "$env:RUNNER_TEMP\nc-direct-slab-phase71"
          if($LASTEXITCODE -ne 0){throw 'fixture preparation failed'}
      - name: Restore SHA-256 pinned Java dependencies
        shell: pwsh
        run: |
          @'
          import pathlib,json,hashlib,time,urllib.request,urllib.error
          manifest=json.loads(pathlib.Path('patches/mainserver_protocol_20261114/logs/dependencies.json').read_text())
          root=pathlib.Path('.compile-deps');root.mkdir(exist_ok=True)
          for row in manifest:
              jar=root/row['file']
              if jar.exists() and hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256']:continue
              url=row['url'];urls=[url]
              if 'repo.maven.apache.org/maven2/' in url:
                  suffix=url.split('repo.maven.apache.org/maven2/',1)[1]
                  urls=['https://maven.aliyun.com/repository/central/'+suffix,
                        'https://mirrors.huaweicloud.com/repository/maven/'+suffix,url]
              errors=[]
              for attempt in range(3):
                  for u in urls:
                      try:
                          req=urllib.request.Request(u,headers={'User-Agent':'RKern-Win-IOCP-Validate/1.0'})
                          with urllib.request.urlopen(req,timeout=45) as response: data=response.read()
                          if hashlib.sha256(data).hexdigest()!=row['sha256']:raise RuntimeError('jar hash mismatch: '+jar.name)
                          jar.write_bytes(data);break
                      except (urllib.error.URLError,urllib.error.HTTPError,TimeoutError) as error:errors.append(str(error))
                  if jar.exists() and hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256']:break
                  time.sleep(3*(attempt+1))
              assert jar.exists() and hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256'],(jar,errors[-4:])
          print('PHASE64_PINNED_DEPENDENCIES',len(manifest))
          '@ | python -
      - name: Compile every Java 21 production source and native IOCP regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'nc-direct-slab-phase71'
          $deps=Join-Path $PWD '.compile-deps\*'
          New-Item -ItemType Directory -Force -Path "$root\classes","$root\testclasses" | Out-Null
          & javac --enable-preview --release 21 -encoding UTF-8 -J-Xmx5g -cp "$deps" -d "$root\classes" "@$root\sources.txt"
          if($LASTEXITCODE -ne 0){throw 'Java 21 full source compilation failed'}
          & javac --enable-preview --release 21 -encoding UTF-8 -cp "$root\classes;$deps" -d "$root\testclasses" "$root\testsrc\l1j\server\server\model\network\core\transport\CIOPacketCodecReference.java" "$root\testsrc\l1j\server\server\model\network\core\connection\CSharedBroadcastWindowsTest.java"
          if($LASTEXITCODE -ne 0){throw 'Java 21 real IOCP harness compile failed'}
          Write-Host 'PHASE71_1710_JAVA21_COMPILED'
      - name: Run 10 real Windows IOCP direct-slab S packet cipher and closure rounds
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'nc-direct-slab-phase71'
          for($i=1;$i -le 10;$i++){
            Write-Host "PHASE71_NATIVE_POOLED_ROUND_$i"
            python patches/broadcast_nonsc_phase64_20261116/run_windows_real.py "$root"
            if($LASTEXITCODE -ne 0){throw "Windows pooled-native S packet round $i failed"}
          }
          Write-Host 'PHASE71_NATIVE_POOLED_WINDOWS_10_ROUNDS_PASS'
      - name: Publish one full SRC with pinned MSVC DLL after passed tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'nc-direct-slab-phase71'
          python patches/nc_direct_slab_phase71_20261116/migrate.py "$root" package
          if($LASTEXITCODE -ne 0){throw 'phase71 final zip validation failed'}
          Copy-Item "$root\audit.json" "patches/nc_assemble_phase71_20261116/audit.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/RKern_NC_DirectSlab_SPackets_FULL_SRC_20261116.zip
          git add -f patches/nc_assemble_phase71_20261116/audit.json
          git diff --cached --quiet
          if($LASTEXITCODE -eq 0){exit 0}
          git commit -m "Publish NC pooled native S-packet source and verified DLL [skip ci]"
          if($LASTEXITCODE -ne 0){throw 'commit failed'}
          git pull --rebase origin "$env:GITHUB_REF_NAME"
          if($LASTEXITCODE -ne 0){throw 'rebase failed'}
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if($LASTEXITCODE -ne 0){throw 'push failed'}
