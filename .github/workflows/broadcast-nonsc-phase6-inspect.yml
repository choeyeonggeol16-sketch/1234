name: Inspect remaining phase6 display effect broadcasts
on:
  push:
    branches: [broadcast-nonsc-phase6-20261115]
    paths:
      - ".github/workflows/broadcast-nonsc-phase6-inspect.yml"
      - "patches/broadcast_nonsc_phase6_20261115/inspect.py"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact phase5 compiled full source
        run: python3 patches/broadcast_nonsc_phase6_20261115/inspect.py
      - name: Commit source evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/broadcast_nonsc_phase6_20261115/FOCUS.txt
          git diff --cached --quiet && exit 0
          git commit -m "Publish phase6 source evidence [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
