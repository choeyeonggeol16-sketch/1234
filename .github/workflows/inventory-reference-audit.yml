name: Inventory reference audit
on: [push]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan production Java references
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          root=pathlib.Path('rkern/src')
          files=list(root.rglob('*.java'))
          print('JAVA_FILES',len(files))
          assert len(files)>1000
          patterns={
            'OLD_CLASS':r'\bL1(?:Pc)?Inventory\b',
            'EQUIP_CALL':r'\bsetEquipped\s*\(',
            'RESTORE_CALL':r'\bsendOptioon\s*\(',
            'VISIBILITY_CALL':r'\bsetTimeVisible\s*\(',
            'SLOT_CALL':r'\bslotItemFind\s*\(',
          }
          for kind,pat in patterns.items():
            n=0
            for p in files:
              for i,line in enumerate(p.read_text(encoding='utf-8-sig',errors='replace').splitlines(),1):
                if re.search(pat,line):
                  print(f'{kind} {p}:{i}: {line.strip()}')
                  n+=1
            print(kind,'TOTAL',n)
          PY
