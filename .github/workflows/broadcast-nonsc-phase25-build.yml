name: Broadcast phase25 shared clan raid and trap notices
on:
  push:
    branches: [broadcast-nonsc-phase25-20261115]
    paths:
      - ".github/workflows/broadcast-nonsc-phase25-build.yml"
      - "patches/broadcast_nonsc_phase25_20261115/migrate_clan_raid_trap.py"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Migrate clan party and trap broadcast from phase24
        run: |
          python3 patches/broadcast_nonsc_phase25_20261115/migrate_clan_raid_trap.py --work "$RUNNER_TEMP/broadcast-phase25"
      - name: Restore pinned SHA256 Java dependencies
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,urllib.request
          manifest=json.loads(pathlib.Path('patches/mainserver_protocol_20261114/logs/dependencies.json').read_text())
          root=pathlib.Path('.compile-deps');root.mkdir(exist_ok=True)
          for row in manifest:
            jar=root/row['file'];urllib.request.urlretrieve(row['url'],jar)
            assert hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256'],row['file']
          print('Verified pinned dependencies:',len(manifest))
          PY
      - name: Full Java21 compile, server-message parity and ZIP CRC
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/broadcast-phase25"
          find "$root/src" -name '*.java' | sort > "$root/sources.txt"
          test "$(wc -l < "$root/sources.txt")" -eq 1710
          mkdir -p "$root/classes" "$root/testclasses"
          javac --enable-preview --release 21 -encoding UTF-8 -J-Xmx5g -cp "$(pwd)/.compile-deps/*" -d "$root/classes" @"$root/sources.txt"
          javac --enable-preview --release 21 -encoding UTF-8 -cp "$root/classes:$(pwd)/.compile-deps/*" -d "$root/testclasses" "$root/testsrc/Phase25ServerMessageParity.java"
          java --enable-preview -cp "$root/testclasses:$root/classes:$(pwd)/.compile-deps/*" Phase25ServerMessageParity
          python3 - <<'PY'
          import json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'broadcast-phase25'
          d=json.loads((root/'audit.json').read_text())
          assert d['java_sources']==1710 and len(d['modified_java'])==6
          assert d['clan_notice_loops']==4 and d['raid_party_notice_loops']==3
          assert d['hadin_trap_notice_loops']==2
          assert d['party_predicates_and_teleport_order_preserved']
          assert d['trap_item_commit_order_preserved'] and d['native_unchanged']
          assert d['no_fallback'] and d['no_new_queue_or_workers']
          with zipfile.ZipFile('downloads/RKern_Broadcast_NonSC_Phase25_FULL_SRC_20261115.zip') as z:
            assert z.testzip() is None
            assert sum(n.endswith('.java') for n in z.namelist())==1710
          print('PHASE25_VERIFIED',d['output_sha256'])
          PY
      - name: Publish one validated full SRC ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/RKern_Broadcast_NonSC_Phase25_FULL_SRC_20261115.zip
          git diff --cached --quiet && exit 0
          git commit -m "Publish phase25 compiled shared broadcast full SRC [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
