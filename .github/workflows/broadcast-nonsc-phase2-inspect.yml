name: Audit non-SC broadcast phase2
on:
  push:
    branches: [broadcast-nonsc-phase2-20261115]
    paths:
      - "patches/broadcast_nonsc_phase2_20261115/inspect.py"
      - ".github/workflows/broadcast-nonsc-phase2-inspect.yml"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 patches/broadcast_nonsc_phase2_20261115/inspect.py
      - name: Publish exact snippets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/broadcast_nonsc_phase2_20261115/SOURCES.txt
          git diff --cached --quiet && exit 0
          git commit -m "Capture canonical broadcast entrypoint snippets [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
