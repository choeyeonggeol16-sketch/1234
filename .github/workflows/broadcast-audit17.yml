name: Inspect remaining raid and KDA broadcaster callers
on:
  push:
    branches: [broadcast-nonsc-audit17-20261115]
    paths: [".github/workflows/broadcast-audit17.yml"]
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect phase14 full SRC
        run: |
          python3 - <<'PY'
          import zipfile,hashlib,re
          p='downloads/RKern_Broadcast_NonSC_Phase14_FULL_SRC_20261115.zip'
          b=open(p,'rb').read()
          assert hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()=="85b50b789b9152d35d480352a2dfde76ca042f45"
          with zipfile.ZipFile(p) as z:
            names=z.namelist()
            for short in ["Normal.java","DeathHeal.java","ReCall.java","WideAreaSkill.java","MJKDA.java","S_IconMessage.java","SC_IconMessage.java","SC_EffectLocation.java","CAttackAction.java","ItemUseWorldHelpers.java"]:
              found=[n for n in names if n.endswith('/'+short)]
              print("\n=========FILE",short,found)
              for name in found[:2]:
                lines=z.read(name).decode("utf8").splitlines()
                if short in ("S_IconMessage.java","SC_IconMessage.java"):segments=[(0,min(len(lines),240))]
                elif "/BossSkill/" in name:segments=[(0,min(len(lines),190))]
                else:
                  points=[i for i,l in enumerate(lines) if "broadcastPacket(" in l or "broadcastPacketToAll(" in l or "broadcast(" in l]
                  segments=[]
                  for i in points:
                    a=max(0,i-13);b=min(len(lines),i+25)
                    if segments and a<=segments[-1][1]:segments[-1]=(segments[-1][0],max(b,segments[-1][1]))
                    else:segments.append((a,b))
                for a,b in segments[:10]:
                  for i in range(a,b):print(f"{i+1:4} {lines[i]}")
          PY
