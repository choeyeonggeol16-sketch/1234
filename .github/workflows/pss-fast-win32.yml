name: Win32 DLL build with preinstalled cross compiler
on:
  push:
    branches:
      - pss/inband-independent-ui-init-20261106
    paths:
      - .github/workflows/pss-fast-win32.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mingw:
    runs-on: ubuntu-24.04
    container: dockcross/windows-static-x86:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build final PE32 without downloading apt toolchains
        run: |
          echo "Available cross compilers:"
          find /usr /opt -type f -name '*mingw*gcc*' -print 2>/dev/null | head -20 || true
          found=$(find /usr /opt -type f \( -name 'i686-w64-mingw32*gcc' -o -name 'i686-w64-mingw32*gcc-posix' \) -print -quit 2>/dev/null)
          if [ -z "$found" ]; then
             echo "No i686 cross-compiler found in container" >&2; exit 1
          fi
          export PSS_CC="$found"
          export PSS_CXX="${found%gcc}g++"
          if [ ! -x "$PSS_CXX" ]; then
             echo "No matching C++ cross-compiler: $PSS_CXX" >&2; exit 1
          fi
          bash client/pss2019/build-linux.sh
          (cd client && sha256sum -c Pss2019.dll.sha256)
          file client/Pss2019.dll || true
      - uses: actions/upload-artifact@v4
        with:
          name: PSS-InBand-LiveAppCenter-Win32
          path: |
            client/Pss2019.dll
            client/Pss2019.dll.sha256
          retention-days: 7
