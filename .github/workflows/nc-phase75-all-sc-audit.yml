name: "Phase75 inventory entire SC packet broadcast surface"
on:
  push:
    branches: [nc-assemble-all-sc-phase75-20261116]
    paths:
      - ".github/workflows/nc-phase75-all-sc-audit.yml"
      - "patches/nc_phase75_all_sc_20261116/audit.py"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Check pinned 74 full src and enumerate remaining SC broadcasters
        run: python3 patches/nc_phase75_all_sc_20261116/audit.py
      - name: Publish source-extracted verified inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/nc_phase75_all_sc_inventory
          git diff --cached --quiet && exit 0
          git commit -m "Inventory all remaining SC packet broadcast paths [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
