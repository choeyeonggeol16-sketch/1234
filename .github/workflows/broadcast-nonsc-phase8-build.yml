name: Non-SC broadcast phase8 NPC and teleport shared removal
on:
  push:
    branches: [broadcast-nonsc-phase8-20261115]
    paths:
      - ".github/workflows/broadcast-nonsc-phase8-build.yml"
      - "patches/broadcast_nonsc_phase8_20261115/migrate_npc_removal.py"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Apply source-pinned phase8 shared removal migration
        run: |
          python3 patches/broadcast_nonsc_phase8_20261115/migrate_npc_removal.py \
            --work "$RUNNER_TEMP/broadcast-nonsc-phase8"
      - name: Fetch and verify Java compilation dependencies
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,urllib.request
          manifest=json.loads(pathlib.Path('patches/mainserver_protocol_20261114/logs/dependencies.json').read_text())
          root=pathlib.Path('.compile-deps')
          root.mkdir(exist_ok=True)
          for row in manifest:
            jar=root/row['file']
            urllib.request.urlretrieve(row['url'],jar)
            assert hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256'],row['file']
          print('Verified dependencies:',len(manifest))
          PY
      - name: Compile 1711 Java21 sources, verify shared remove bytes and ZIP
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/broadcast-nonsc-phase8"
          find "$root/src" -name '*.java' | sort > "$root/sources.txt"
          test "$(wc -l < "$root/sources.txt")" -eq 1711
          mkdir -p "$root/classes" "$root/testclasses"
          javac --enable-preview --release 21 -encoding UTF-8 -J-Xmx5g \
            -cp "$(pwd)/.compile-deps/*" -d "$root/classes" @"$root/sources.txt"
          javac --enable-preview --release 21 -encoding UTF-8 \
            -cp "$root/classes:$(pwd)/.compile-deps/*" \
            -d "$root/testclasses" "$root/testsrc/SharedRemovalParity8.java"
          java --enable-preview -cp "$root/testclasses:$root/classes:$(pwd)/.compile-deps/*" \
            SharedRemovalParity8
          python3 - <<'PY'
          import json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'broadcast-nonsc-phase8'
          d=json.loads((root/'audit.json').read_text())
          assert len(d['modified_files'])==2 and d['full_java_sources']==1711
          assert d['npc_delete_aoi_snapshot_order_preserved']
          assert d['npc_teleport_effect_remove_known_order_preserved']
          assert d['npc_recognize_filter_preserved']
          assert d['pc_teleport_exclude_self_preserved']
          assert d['no_fallback'] and d['native_dll_unchanged']
          with zipfile.ZipFile('downloads/RKern_Broadcast_NonSC_Phase8_FULL_SRC_20261115.zip') as z:
            assert z.testzip() is None
            assert sum(x.endswith('.java') for x in z.namelist())==1711
          print('PHASE8_SHARED_REMOVAL_FULL_SRC_VALIDATED',d['output_sha256'])
          PY
      - name: Publish one verified whole-source ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/RKern_Broadcast_NonSC_Phase8_FULL_SRC_20261115.zip
          git diff --cached --quiet && exit 0
          git commit -m "Publish validated phase8 NPC and teleport shared removal full SRC [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
