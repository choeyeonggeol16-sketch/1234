name: Builder command migration compile
on:
  push:
    branches:
      - rkern/builder-command-reference-audit-20261126
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            rkern/src
            rkern/docs/jproring_cio_integration_20261120
      - name: Assert obsolete command classes and references removed
        run: |
          git grep -n 'BuilderCmd2Handler(' -- rkern/src
          status=0
          if matches=$(git grep -n -w -E 'GMCommands|L1Commands|L1Command|L1CommandHelp|GMCommandsConfig|L1LetterCommand|L1LevelPresent|L1ImPactGfxid1|L1ImPactGfxid|L1Burf|L1PowerKick|L1SkillEffect|L1AdShop|L1RemoveLetter|L1HpBar|L1Search1|L1Reload|L1Buff|L1Summon|L1Shutdown|L1Search|L1ItemDelete|L1QueryCharacter|L1PartyRecall|L1Poly|L1Present|L1Status|L1SKick|L1NpcShopSwitch|L1HomeTown|L1Favorite|L1EventSpawn|L1CheckCharacter|L1CheckPassword|L1ToSpawn|L1RangeKick|L1DatabaseInit|L1SpawnRobot|L1SpawnCmd|L1FakeCharacter|L1InsertSpawn|L1BanIp|L1GM|L1GMQuestion|L1CreateItemSet|L1ShowTrap|L1Thread|L1AddSkill|L1NpcDown|L1ServerName|L1Clear|L1Describe|L1DeleteGroundItem|L1DescIdWeapon|L1DescIdArmor|L1DescId|L1Level|L1ReloadTrap|L1ResetTrap|L1ServerMessage|L1BuffIcon|L1GfxId|L1InvGfxId|L1SkillIcon|L1ChatNG|L1Chat|L1Ress|L1Visible|L1Recall|L1Kick|L1Loc|L1Move|L1Invisible|L1Kill|L1ToPC|L1Echo|L1Action|L1Speed|L1Patrol|L1AllBuff|L1ChatNG2|L1ChangeWeather|L1Who|L1RessBuff|L1AttackLog|L1GMRoom|L1AccountBanKick' -- rkern/src); then
            # GMCommands.xml is a configuration filename, and CObjectDB uses
            # L1Summon as an NPC prototype discriminator, not a command class.
            matches=$(printf '%s\n' "$matches" | grep -v 'GMCommands.xml' | grep -vE '^rkern/src/l1j/server/server/datatables/CObjectDB.java:[0-9]+:[[:space:]]*case "L1Doll".*"L1Summon", "L1SummonInstance".*NPC_CONTEXT_REQUIRED;' || true)
            if [ -n "$matches" ]; then
              printf '%s\n' "$matches"
              status=1
            fi
          else
            result=$?
            if [ "$result" -ne 1 ]; then exit "$result"; fi
          fi
          if git grep -n 'registerExisting(loaded,' -- rkern/src; then status=1; fi
          echo 'Remaining unregistered L1CommandExecutor implementations:'
          git grep -l 'implements L1CommandExecutor' -- rkern/src || true
          if git grep -n -E '(^|[^[:alnum:]_])(BuilderCmd_spawn_robot|BuilderCmd_attack_log|BuilderDuplicateKick|doGiveEventStaff|doGiveEventStaff1|doGiveEventStaff2|킬삭제|킬증가|데스삭제|데스증가)[[:space:]]*\(' -- rkern/src; then status=1; fi
          if git grep -n -w -E 'L1Adena|L1CreateItem|L1Describe2|BuilderCmd_desc_weapon|BuilderCmd_desc_armor|BuilderCmd_desc_etc|BuilderCmd_remove_letter|BuilderRemoveLetters' -- rkern/src; then status=1; fi
          if git grep -n -E 'register(Direct|LevelCommand)\(loaded, "(데무|데방|데스크|편지삭제)"' -- rkern/src; then status=1; fi
          exit "$status"
      - uses: actions/cache@v4
        if: ${{ !cancelled() }}
        with:
          path: ~/.cache/rkern-skill-deps
          key: rkern-skill-jars-v1
      - name: Compile Java 21
        if: ${{ !cancelled() }}
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 - <<'PY'
          import importlib.util, os, subprocess, time, urllib.error
          from pathlib import Path
          root = Path("rkern").resolve()
          work = Path(os.environ["RUNNER_TEMP"]) / "builder-compile"
          classes = work / "classes"
          classes.mkdir(parents=True, exist_ok=True)
          spec = importlib.util.spec_from_file_location("helper", root / "docs/jproring_cio_integration_20261120/run_game_ab.py")
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          for attempt in range(5):
              try:
                  cp = helper.classpath(classes, Path.home() / ".cache/rkern-skill-deps")
                  break
              except urllib.error.HTTPError as e:
                  if e.code not in (429, 500, 502, 503, 504) or attempt == 4: raise
                  time.sleep(4 * (attempt + 1))
          sources = sorted((root / "src").rglob("*.java"))
          args = work / "sources.txt"
          args.write_text("".join('"' + str(p) + '"\n' for p in sources), encoding="utf-8")
          print("Production sources:", len(sources), flush=True)
          subprocess.run(["javac","-J-Xmx2g","-encoding","UTF-8","-source","21","-target","21","--enable-preview","-cp",cp,"-d",str(classes),"@"+str(args)],check=True,timeout=300)
          print("PASS Java 21 compile",flush=True)
          test = work / "BuilderPermissionTest.java"
          test.write_text("""
          import l1j.server.Config;
          import l1j.server.server.BuilderCmdHandler;
          import l1j.server.server.command.BuilderCmdPairType;
          public final class BuilderPermissionTest {
              public static void main(String[] args) throws Exception {
                  Config.GMCODE=9999; Config.SUB_GMCODE=100;
                  var check=BuilderCmdHandler.class.getDeclaredMethod("hasBuilderPermission",int.class,BuilderCmdPairType.class);
                  check.setAccessible(true);
                  String[] dangerous={"아이템","아데나","선물","전체선물","오토선물","세트아이템","아이템삭제","인벤삭제","유저인벤삭제","암호변경","디비초기화","검사"};
                  for(String name:dangerous) {
                      var entry=new BuilderCmdPairType(name,9999,true,(p,c,a)->{});
                      for(int access:new int[]{0,5048,100,9999}) {
                          boolean actual=(Boolean)check.invoke(null,access,entry);
                          if(actual!=(access==9999))throw new AssertionError(name+" "+access);
                      }
                  }
                  var ordinary=new BuilderCmdPairType("누구",9999,true,(p,c,a)->{});
                  for(int access:new int[]{0,5048,100,9999})
                      if((Boolean)check.invoke(null,access,ordinary)!=(access==100||access==9999))
                          throw new AssertionError("ordinary "+access);
                  Config.GMCODE=9000;
                  if(!(Boolean)check.invoke(null,9000,ordinary) || (Boolean)check.invoke(null,9999,ordinary))
                      throw new AssertionError("configured GM level");
                  Config.GMCODE=0; Config.SUB_GMCODE=0;
                  if((Boolean)check.invoke(null,0,ordinary))throw new AssertionError("zero configured access");
                  System.out.println("PASS Builder permission policy (55 checks)");
              }
          }
          """, encoding="utf-8")
          subprocess.run(["javac","-encoding","UTF-8","--enable-preview","--release","21","-cp",cp+os.pathsep+str(classes),"-d",str(classes),str(test)],check=True)
          subprocess.run(["java","--enable-preview","-cp",cp+os.pathsep+str(classes),"BuilderPermissionTest"],check=True)

          PY
