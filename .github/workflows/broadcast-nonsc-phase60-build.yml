name: Broadcast phase60 shared chat fanouts and raid poison remove
on:
  push:
    branches: [broadcast-nonsc-phase60-20261116]
    paths:
      - ".github/workflows/broadcast-nonsc-phase60-build.yml"
      - "patches/broadcast_nonsc_phase60_20261116/migrate_chat_poison.py"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Migrate the remaining shared-chat and raid poison fanouts from phase58
        run: |
          python3 patches/broadcast_nonsc_phase60_20261116/migrate_chat_poison.py --work "$RUNNER_TEMP/broadcast-phase60"
      - name: Restore cached pinned compile dependencies
        uses: actions/cache@v4
        with:
          path: .compile-deps
          key: rkern-java21-deps-${{ hashFiles('patches/mainserver_protocol_20261114/logs/dependencies.json') }}
      - name: Restore SHA256 pinned Java dependencies
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,urllib.request,urllib.error,time
          manifest=json.loads(pathlib.Path('patches/mainserver_protocol_20261114/logs/dependencies.json').read_text())
          root=pathlib.Path('.compile-deps');root.mkdir(exist_ok=True)
          for row in manifest:
            jar=root/row['file']
            if jar.exists() and hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256']:
              continue
            url=row['url']
            candidates=[url]
            if 'repo.maven.apache.org/maven2/' in url:
              suffix=url.split('repo.maven.apache.org/maven2/',1)[1]
              candidates=[
                'https://maven.aliyun.com/repository/central/'+suffix,
                'https://mirrors.huaweicloud.com/repository/maven/'+suffix,
                url,
                'https://repo1.maven.org/maven2/'+suffix
              ]
            errors=[]
            for attempt in range(3):
              for mirror in candidates:
                try:
                  req=urllib.request.Request(mirror,headers={'User-Agent':'RKern-Compile-Verify/1.0'})
                  with urllib.request.urlopen(req,timeout=45) as response:
                    blob=response.read()
                  if hashlib.sha256(blob).hexdigest()!=row['sha256']:
                    raise RuntimeError('dependency hash mismatch: '+row['file'])
                  jar.write_bytes(blob)
                  break
                except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError) as exc:
                  errors.append(str(exc))
              if jar.exists() and hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256']:
                break
              time.sleep(min(40,5*(attempt+1)))
            assert jar.exists() and hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256'],(row['file'],errors[-3:])
          print('Verified pinned dependencies:',len(manifest))
          PY
      - name: Compile Java21 full sources, packet parity and ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/broadcast-phase60"
          find "$root/src" -name '*.java' | sort > "$root/sources.txt"
          test "$(wc -l < "$root/sources.txt")" -eq 1710
          mkdir -p "$root/classes" "$root/testclasses"
          javac --enable-preview --release 21 -encoding UTF-8 -J-Xmx5g -cp "$(pwd)/.compile-deps/*" -d "$root/classes" @"$root/sources.txt"
          javac --enable-preview --release 21 -encoding UTF-8 -cp "$root/classes:$(pwd)/.compile-deps/*" -d "$root/testclasses" "$root/testsrc/Phase57SharedFrameParity.java" "$root/testsrc/Phase60ChatParity.java"
          java --enable-preview -cp "$root/testclasses:$root/classes:$(pwd)/.compile-deps/*" Phase57SharedFrameParity
          java --enable-preview -cp "$root/testclasses:$root/classes:$(pwd)/.compile-deps/*" Phase60ChatParity
          python3 - <<'PY'
          import json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'broadcast-phase60'
          d=json.loads((root/'audit.json').read_text())
          assert d['java']==1710 and len(d['modified'])==2
          assert d['chat_fanouts_shared']==3 and d['raid_remove_shared']==1
          assert d['receiver_order_preserved'] and d['unchanged_other_bytes']
          assert d['native_unchanged'] and d['no_new_workers_queues_fallback']
          with zipfile.ZipFile('downloads/RKern_Broadcast_NonSC_Phase60_FULL_SRC_20261116.zip') as z:
            assert z.testzip() is None
            assert sum(n.endswith('.java') for n in z.namelist())==1710
          print('PHASE58_VERIFIED',d['sha256'])
          PY
      - name: Publish one verified whole source ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/RKern_Broadcast_NonSC_Phase60_FULL_SRC_20261116.zip
          git diff --cached --quiet && exit 0
          git commit -m "Publish phase60 verified shared chat/raid removal SRC [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
