name: RKern broadcast phase65 1-55 final evidence gate
on:
  push:
    branches: [broadcast-nonsc-phase65-historical-audit-20261116]
    paths:
      - ".github/workflows/broadcast-phase65-final-gate.yml"
      - "patches/broadcast_nonsc_phase65_20261116/final_gate.py"
permissions:
  contents: write
  actions: read
jobs:
  verdict:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Confirm every artifact and successful native Windows run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 patches/broadcast_nonsc_phase65_20261116/final_gate.py
      - name: Publish one Korean historical verification memo
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/broadcast_nonsc_phase65_20261116/FINAL_VERDICT_KO.md
          git diff --cached --quiet && exit 0
          git commit -m 'Publish final broadcast phase1-55 verified regression report [skip ci]'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
