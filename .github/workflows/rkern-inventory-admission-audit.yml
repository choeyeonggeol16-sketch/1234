name: RKern inventory admission and compilation
on:
  push:
    branches:
      - rkern/nc-inventory-carrying-weight-20261125
      - rkern/nc-ground-pick-receipt-20261125
      - rkern/nc-inventory-change-notice-20261125
      - rkern/nc-inventory-responsibility-20261125
      - rkern/nc-warehouse-transaction-20261125
      - rkern/nc-item-transfer-dedup-20261125
      - rkern/nc-inventory-merge-dedup-20261125
      - rkern/nc-item-copy-dedup-20261125
      - rkern/nc-inventory-search-20261125
      - rkern/nc-inventory-delete-dedup-20261125
      - rkern/nc-inventory-final-audit-20261125
      - rkern/nc-inventory-ownership-audit-20261125
      - rkern/nc-inventory-session-audit-20261125
      - rkern/nc-inventory-commit-audit-20261125
      - rkern/nc-ground-timer-audit-20261125
      - rkern/nc-ground-timer-admission-20261125
      - rkern/nc-ground-tile-retirement-20261125
      - rkern/nc-inventory-cache-audit-20261125
      - rkern/nc-equipment-notice-audit-20261125
      - rkern/nc-equipment-expiry-audit-20261125
      - rkern/nc-equipment-enchant-audit-20261125
      - rkern/nc-inventory-integration-audit-20261125
      - rkern/nc-creature-parameter-core-20261125
      - rkern/nc-creature-defense-core-20261125
      - rkern/nc-creature-stats-core-20261125
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            rkern/src
            rkern/docs/jproring_cio_integration_20261120
            rkern/docs/inventory_weight_20261125
            rkern/docs/nc_creature_stat_audit_20261125
      - name: Check bookmark field references
        run: |
          if grep -RnE '\.[[:space:]]*_bookmarks\b' rkern/src --include='*.java' --exclude=L1ItemInstance.java; then
            echo 'Unexpected direct item bookmark field reference'
            exit 1
          fi
      - name: Check item initialization ownership
        run: |
          if grep -Rn 'CInventory.InitializeNewItemLifetimeAndFuel' rkern/src --include='*.java'; then
            echo 'Stale inventory initialization reference'
            exit 1
          fi
      - name: Verify JDBC receipt outcomes
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/inventory_weight_20261125/test_commit_outcome.py
      - name: Verify ground timer races
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/inventory_weight_20261125/test_ground_timer_race.py
      - name: Verify ground timer admission
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/inventory_weight_20261125/test_ground_timer_admission.py
      - name: Verify ground tile retirement
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/inventory_weight_20261125/test_ground_tile_retirement.py
      - name: Verify inventory cache lifecycle
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/inventory_weight_20261125/test_inventory_cache_lifecycle.py
      - name: Verify equipment notification failures
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/inventory_weight_20261125/test_equipment_notice.py
      - name: Verify equipped enchant delta
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/inventory_weight_20261125/test_equipment_enchant_delta.py
      - name: Verify receipt completion session races
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/inventory_weight_20261125/test_inventory_completion_race.py
      - name: Verify base parameters
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/nc_creature_stat_audit_20261125/test_base_parameters.py
      - name: Verify shared creature defense
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/nc_creature_stat_audit_20261125/test_creature_defense.py
      - name: Verify shared primary stats and skill references
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/nc_creature_stat_audit_20261125/test_creature_primary_stats.py
      - name: Verify flat resistance sources and notifications
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/nc_creature_stat_audit_20261125/test_creature_resistance.py
      - name: Verify unified magic defense creature routing
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/nc_creature_stat_audit_20261125/test_magic_parameter_routes.py
      - name: Verify base magic defense refresh
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/nc_creature_stat_audit_20261125/test_base_mdefend_refresh.py
      - name: Verify shared physical attack and accuracy sources
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/nc_creature_stat_audit_20261125/test_physical_attack_sources.py
      - name: Verify shared magic hit and critical sources
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/nc_creature_stat_audit_20261125/test_magic_critical_sources.py
      - name: Verify shared damage mitigation sources
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/nc_creature_stat_audit_20261125/test_damage_mitigation_sources.py
      - name: Verify shared HP MP and regeneration sources
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/nc_creature_stat_audit_20261125/test_vital_sources.py
      - name: Verify stat lifecycle defects
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 rkern/docs/nc_creature_stat_audit_20261125/test_stat_lifecycle.py
      - name: Cache existing build dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/rkern-skill-deps
          key: rkern-skill-jars-v1
      - name: Compile production Java 21
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          java -version
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import subprocess
          import time
          import urllib.error
          import urllib.request
          root = Path("rkern").resolve()
          work = Path(os.environ["RUNNER_TEMP"]) / "inventory-admission"
          classes = work / "classes"
          classes.mkdir(parents=True, exist_ok=True)
          spec = importlib.util.spec_from_file_location("helper", root / "docs/jproring_cio_integration_20261120/run_game_ab.py")
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          original_urlopen = urllib.request.urlopen
          def central_urlopen(url, *args, **kwargs):
              try:
                  return original_urlopen(url, *args, **kwargs)
              except urllib.error.HTTPError as exc:
                  if exc.code != 429 or not isinstance(url, str) or not url.startswith("https://repo.maven.apache.org/maven2/"):
                      raise
                  return original_urlopen(url.replace("https://repo.maven.apache.org/maven2/", "https://repo1.maven.org/maven2/", 1), *args, **kwargs)
          urllib.request.urlopen = central_urlopen
          for attempt in range(6):
              try:
                  cp = helper.classpath(classes, Path.home() / ".cache/rkern-skill-deps")
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code not in (429, 500, 502, 503, 504) or attempt == 5:
                      raise
                  time.sleep(min(4 * (attempt + 1), 20))
          sources = sorted((root / "src").rglob("*.java"))
          print("Production Java files:", len(sources), flush=True)
          sources.append(root / "docs/inventory_weight_20261125/TestCarryingWeight.java")
          args = work / "sources.txt"
          args.write_text("".join('"' + str(p) + '"\n' for p in sources), encoding="utf-8")
          print("Production Java files:", len(sources), flush=True)
          subprocess.run(["javac", "-J-Xmx2g", "-encoding", "UTF-8", "-source", "21",
                          "-target", "21", "--enable-preview", "-cp", cp, "-d", str(classes),
                          "@" + str(args)], check=True, timeout=300)
          print("PASS full production Java 21 compile", flush=True)
          subprocess.run(["java", "--enable-preview", "-ea", "-cp", cp,
                          "l1j.server.server.model.inventory.TestCarryingWeight"], cwd=work, check=True, timeout=120)
          PY
