name: MainServer PlaySupport package integration
on:
  push:
    branches:
      - mainserver-playsupport-20261115
    paths:
      - '.github/workflows/mainserver-playsupport.yml'
      - 'patches/mainserver_playsupport_20261115/**'
permissions:
  contents: write
jobs:
  move-and-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Migrate existing PSS code from latest compiled full source
        run: |
          python3 patches/mainserver_playsupport_20261115/migrate_playsupport.py --work "$RUNNER_TEMP/playsupport"
      - name: Verify pinned compilation dependencies
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          records = json.loads(pathlib.Path('patches/mainserver_protocol_20261114/logs/dependencies.json').read_text())
          root = pathlib.Path('.compile-deps')
          root.mkdir(exist_ok=True)
          for dep in records:
              dst = root / dep['file']
              urllib.request.urlretrieve(dep['url'], dst)
              if hashlib.sha256(dst.read_bytes()).hexdigest() != dep['sha256']:
                  raise RuntimeError(f"Dependency hash mismatch: {dst.name}")
          print(f"Verified {len(records)} external dependencies")
          PY
      - name: Full Java 21 compilation and PSS symbol validation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/playsupport/classes"
          find "$RUNNER_TEMP/playsupport/src" -name '*.java' | sort > "$RUNNER_TEMP/playsupport/sources.txt"
          echo "Java source count: $(wc -l < "$RUNNER_TEMP/playsupport/sources.txt")"
          javac --enable-preview --release 21 -encoding UTF-8 -J-Xmx5g \
            -cp "$(pwd)/.compile-deps/*" \
            -d "$RUNNER_TEMP/playsupport/classes" @"$RUNNER_TEMP/playsupport/sources.txt"
          test -f "$RUNNER_TEMP/playsupport/classes/l1j/server/server/packets/Protocol/MainServer/PlaySupport/PlaySupport2019.class"
          test -f "$RUNNER_TEMP/playsupport/classes/l1j/server/server/packets/Protocol/MainServer/PlaySupport/PssConfig.class"
          test -f "$RUNNER_TEMP/playsupport/classes/l1j/server/server/packets/Protocol/MainServer/PlaySupport/PssDailyQuota.class"
          test -f "$RUNNER_TEMP/playsupport/classes/l1j/server/server/packets/Protocol/MainServer/PlaySupport/Proto/SC_PssNativeWindow.class"
          test -f "$RUNNER_TEMP/playsupport/classes/l1j/server/server/packets/Protocol/MainServer/PlaySupport/window/PlaySupportWindow.class"
          test ! -e "$RUNNER_TEMP/playsupport/classes/l1j/server/server/model/character/pss/PlaySupport2019.class"
          javap -classpath "$RUNNER_TEMP/playsupport/classes" \
            l1j.server.server.packets.Protocol.MainServer.PlaySupport.PlaySupport2019 \
            | grep -q handleStartPlaySupportRequest
          javap -classpath "$RUNNER_TEMP/playsupport/classes" \
            l1j.server.server.packets.Protocol.MainServer.PlaySupport.PssConfig \
            | grep -q reload
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          work=pathlib.Path(os.environ['RUNNER_TEMP'])/'playsupport'
          r=json.loads((work/'report.json').read_text())
          assert r['java_count']==1711 and r['moved_classes']==7 and r['config_path_unchanged']
          z=zipfile.ZipFile('downloads/CTransport_MainServer_PlaySupport_FULL_SRC_20261115.zip')
          assert z.testzip() is None
          print('PSS migration, full Java 21 compilation, and ZIP validation passed')
          PY
      - name: Publish one compiled full source ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/CTransport_MainServer_PlaySupport_FULL_SRC_20261115.zip
          git diff --cached --quiet && { echo "Already published"; exit 0; }
          git commit -m "Publish compiled MainServer PlaySupport complete source [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
