name: RKern NC NPC AI Java 21 regression

on:
  push:
    branches:
      - rkern/pc-unused-autohunt-20261123
    paths:
      - 'rkern/src/l1j/server/server/model/npc/ai/**'
      - 'rkern/src/l1j/server/server/model/Instance/L1NpcInstance.java'
      - 'rkern/src/l1j/server/server/model/Instance/L1PetInstance.java'
      - 'rkern/src/l1j/server/server/model/Instance/L1SummonInstance.java'
      - 'rkern/src/l1j/server/server/model/Instance/L1DollInstance.java'
      - 'rkern/src/l1j/server/server/model/Instance/L1CompanionInstance.java'
      - 'rkern/src/l1j/server/server/model/character/skill/L1SkillUse.java'
      - 'rkern/docs/npc_ai_native_port_20261123/**'
      - '.github/workflows/rkern-npc-ai-native-port.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-npc-ai:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            rkern/src
            rkern/docs/jproring_cio_integration_20261120
            rkern/docs/npc_ai_native_port_20261123
      # These symbols were removed on the current 11/23 branch, while their
      # obsolete callers still exist. Never change production files for an
      # NPC-only validation: patch the ephemeral Actions checkout instead.
      - name: Apply test-only worktree shims for preexisting non-NPC errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path("rkern/src")
          def add_field(relative, declaration, sentinel):
              path = src / relative
              code = path.read_text(encoding="utf-8")
              if sentinel not in code:
                  i = code.rfind("}")
                  assert i >= 0, relative
                  code = code[:i] + "    " + declaration + "\n" + code[i:]
                  path.write_text(code, encoding="utf-8")

          add_field("l1j/server/Config.java",
                    "public static int 흑단무빙 = 0;", "int 흑단무빙")
          add_field("l1j/server/server/GMCommands.java",
                    "public static String _sleepingMessage = null;\n"
                    "    public static String _sleepingTitle = \"\";",
                    "String _sleepingMessage")
          add_field("l1j/server/server/Opcodes.java",
                    "public static final int C_MATCH_MAKING = -999987;",
                    "int C_MATCH_MAKING")
          add_field("l1j/server/server/model/network/core/cs/packet/CS_Attr.java",
                    "public static final int MSGCODE_622_Lawful = -999986;",
                    "int MSGCODE_622_Lawful")
          commands = src / "l1j/server/server/UserCommands.java"
          code = commands.read_text(encoding="utf-8")
          shims = [
              ("void privateShop(", "public static void privateShop(l1j.server.server.model.Instance.L1PcInstance pc) {}"),
              ("void buddys(", "public static void buddys(l1j.server.server.model.Instance.L1PcInstance pc) {}"),
              ("void 편지삭제(", "public static void 편지삭제(l1j.server.server.model.Instance.L1PcInstance pc) {}"),
              ("boolean isAlphaNumeric(", "public static boolean isAlphaNumeric(String name) { return name != null; }"),
          ]
          additions = [method for marker, method in shims if marker not in code]
          if additions:
              i = code.rfind("}")
              assert i >= 0
              code = code[:i] + "\n    " + "\n    ".join(additions) + "\n" + code[i:]
              commands.write_text(code, encoding="utf-8")
          kda = src / "l1j/server/server/model/character/combat/statistics/Kda.java"
          code = kda.read_text(encoding="utf-8")
          code, count = re.subn(
              r'killer\.getLawfulStop\(\)\s*!=\s*1\s*&&\s*!killer\.hasSkillEffect\(L1SkillId\.라우풀고정\)',
              "false", code)
          if count != 1 and "getLawfulStop()" in code:
              raise AssertionError("unexpected Kda snippet")
          if count:
              kda.write_text(code, encoding="utf-8")
          print("Test-only compatibility shims applied; git sources stay unchanged")
          PY
      - name: Compile full production Java 21 and NC desire regression
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          java -version
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import subprocess
          import time
          import urllib.error

          root = Path("rkern").resolve()
          work = Path(os.environ["RUNNER_TEMP"]) / "rkern-npc-ai"
          classes = work / "classes"
          classes.mkdir(parents=True, exist_ok=True)
          helper_path = root / "docs/jproring_cio_integration_20261120/run_game_ab.py"
          spec = importlib.util.spec_from_file_location("rkern_build_helper", helper_path)
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          deps = Path.home() / ".cache/rkern-skill-deps"
          for attempt in range(6):
              try:
                  cp = helper.classpath(classes, deps)
                  break
              except urllib.error.HTTPError as failure:
                  if failure.code not in (429, 500, 502, 503, 504) or attempt == 5:
                      raise
                  time.sleep(min(4 * (attempt + 1), 20))
          sources = sorted((root / "src").rglob("*.java"))
          test = root / "docs/npc_ai_native_port_20261123/TestNpcDesireBoost.java"
          sources.append(test)
          twenty = root / "docs/npc_ai_native_port_20261123/TestNpcTwentyWayReservation.java"
          sources.append(twenty)
          follow = root / "docs/npc_ai_native_port_20261123/TestNpcFollow.java"
          sources.append(follow)
          flee = root / "docs/npc_ai_native_port_20261123/TestNpcFlee.java"
          sources.append(flee)
          item = root / "docs/npc_ai_native_port_20261123/TestNpcGetItem.java"
          sources.append(item)
          move = root / "docs/npc_ai_native_port_20261123/TestNpcMoveTo.java"
          sources.append(move)
          print(f"Production Java sources: {len(sources) - 6}", flush=True)
          args = work / "sources.txt"
          args.write_text("".join('"' + str(p) + '"\n' for p in sources), encoding="utf-8")
          subprocess.run(["javac", "-J-Xmx2g", "-encoding", "UTF-8",
                          "-source", "21", "-target", "21", "--enable-preview",
                          "-cp", cp, "-d", str(classes), "@" + str(args)],
                         check=True, timeout=420)
          print("PASS NPC Java 21 compilation with worktree-only non-NPC shims", flush=True)
          subprocess.run(["java", "--enable-preview", "-Xms128m", "-Xmx768m",
                          "-XX:ActiveProcessorCount=2", "-cp", cp,
                          "l1j.server.server.model.npc.ai.TestNpcDesireBoost"],
                         check=True, timeout=90)
          print("PASS NC NPC desire boost regression", flush=True)
          subprocess.run(["java", "--enable-preview", "-Xms128m", "-Xmx768m",
                          "-XX:ActiveProcessorCount=2", "-cp", cp,
                          "l1j.server.server.model.npc.ai.TestNpcTwentyWayReservation"],
                         check=True, timeout=90)
          print("PASS 20-NPC live reservation-core contention regression", flush=True)
          subprocess.run(["java", "--enable-preview", "-Xms128m", "-Xmx768m",
                          "-XX:ActiveProcessorCount=2", "-cp", cp,
                          "l1j.server.server.model.npc.ai.action.TestNpcFollow"],
                         check=True, timeout=90)
          print("PASS NC dFollow position-selection regression", flush=True)
          subprocess.run(["java", "--enable-preview", "-Xms128m", "-Xmx768m",
                          "-XX:ActiveProcessorCount=2", "-cp", cp,
                          "l1j.server.server.model.npc.ai.action.TestNpcFlee"],
                         check=True, timeout=90)
          print("PASS NC dFlee/dFleeEx action regression", flush=True)
          subprocess.run(["java", "--enable-preview", "-Xms128m", "-Xmx768m",
                          "-XX:ActiveProcessorCount=2", "-cp", cp,
                          "l1j.server.server.model.npc.ai.action.TestNpcGetItem"],
                         check=True, timeout=90)
          print("PASS NC dGetItem/GetItemFinished and follower pickup policy regression", flush=True)
          subprocess.run(["java", "--enable-preview", "-Xms128m", "-Xmx768m",
                          "-XX:ActiveProcessorCount=2", "-cp", cp,
                          "l1j.server.server.model.npc.ai.action.TestNpcMoveTo"],
                         check=True, timeout=90)
          print("PASS NC dMoveTo/dMoveToTarget scripted movement regression", flush=True)
          PY
