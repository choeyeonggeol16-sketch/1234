name: Phase79 inspect eight residual SC global broadcasts
on:
  push:
    branches: [nc-assemble-broadcast-phase79-20261116]
    paths:
      - ".github/workflows/nc-phase79-inspect.yml"
      - "patches/nc_assemble_broadcast_phase79_20261116/inspect.py"
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 patches/nc_assemble_broadcast_phase79_20261116/inspect.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/nc_phase79_exact
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract SHA-pinned eight final global SC codecs [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
