name: Broadcast phase27 dragon raids and haunted house
on:
  push:
    branches: [broadcast-nonsc-phase27-20261115]
    paths:
      - ".github/workflows/broadcast-nonsc-phase27-build.yml"
      - "patches/broadcast_nonsc_phase27_20261115/migrate_dragon_haunt.py"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Migrate phase27 raid intro lines and haunted house fanout
        run: |
          python3 patches/broadcast_nonsc_phase27_20261115/migrate_dragon_haunt.py --work "$RUNNER_TEMP/broadcast-phase27"
      - name: Restore pinned Java dependencies
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,urllib.request
          manifest=json.loads(pathlib.Path('patches/mainserver_protocol_20261114/logs/dependencies.json').read_text())
          root=pathlib.Path('.compile-deps');root.mkdir(exist_ok=True)
          for row in manifest:
            jar=root/row['file'];urllib.request.urlretrieve(row['url'],jar)
            assert hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256'],row['file']
          print('Verified pinned dependencies:',len(manifest))
          PY
      - name: Compile all Java21 and check message wire parity and ZIP
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/broadcast-phase27"
          find "$root/src" -name '*.java' | sort > "$root/sources.txt"
          test "$(wc -l < "$root/sources.txt")" -eq 1710
          mkdir -p "$root/classes" "$root/testclasses"
          javac --enable-preview --release 21 -encoding UTF-8 -J-Xmx5g -cp "$(pwd)/.compile-deps/*" -d "$root/classes" @"$root/sources.txt"
          javac --enable-preview --release 21 -encoding UTF-8 -cp "$root/classes:$(pwd)/.compile-deps/*" -d "$root/testclasses" "$root/testsrc/Phase27RaidHauntParity.java"
          java --enable-preview -cp "$root/testclasses:$root/classes:$(pwd)/.compile-deps/*" Phase27RaidHauntParity
          python3 - <<'PY'
          import json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'broadcast-phase27'
          d=json.loads((root/'audit.json').read_text())
          assert d['java_sources']==1710 and len(d['modified_java'])==4
          assert d['dragon_raid_line_broadcast_loops']==3 and d['haunted_house_notice_loops']==2
          assert d['raid_map_filter_and_script_delay_preserved']
          assert d['haunted_member_order_and_map_filter_preserved']
          assert d['native_unchanged'] and d['no_fallback'] and d['no_new_threads_or_queues']
          with zipfile.ZipFile('downloads/RKern_Broadcast_NonSC_Phase27_FULL_SRC_20261115.zip') as z:
            assert z.testzip() is None
            assert sum(n.endswith('.java') for n in z.namelist())==1710
          print('PHASE27_VERIFIED',d['output_sha256'])
          PY
      - name: Publish single validated full source ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/RKern_Broadcast_NonSC_Phase27_FULL_SRC_20261115.zip
          git diff --cached --quiet && exit 0
          git commit -m "Publish phase27 compiled raid broadcast full SRC [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
