name: Broadcast phase17 removed last compatibility broadcasters
on:
  push:
    branches: [broadcast-nonsc-phase17-20261115]
    paths:
      - ".github/workflows/broadcast-nonsc-phase17-build.yml"
      - "patches/broadcast_nonsc_phase17_20261115/remove_last_wrappers.py"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Migrate phase17 whole-source broadcast API consolidation
        run: |
          python3 patches/broadcast_nonsc_phase17_20261115/remove_last_wrappers.py \
            --work "$RUNNER_TEMP/broadcast-phase17"
      - name: Restore pinned Java dependencies
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,urllib.request
          manifest=json.loads(pathlib.Path('patches/mainserver_protocol_20261114/logs/dependencies.json').read_text())
          root=pathlib.Path('.compile-deps')
          root.mkdir(exist_ok=True)
          for row in manifest:
            jar=root/row['file']
            urllib.request.urlretrieve(row['url'],jar)
            assert hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256'],row['file']
          print('Verified dependencies:',len(manifest))
          PY
      - name: Full Java21 compilation, legacy method absence smoke test, ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/broadcast-phase17"
          find "$root/src" -name '*.java' | sort > "$root/sources.txt"
          test "$(wc -l < "$root/sources.txt")" -eq 1711
          mkdir -p "$root/classes" "$root/testclasses"
          javac --enable-preview --release 21 -encoding UTF-8 -J-Xmx5g \
            -cp "$(pwd)/.compile-deps/*" -d "$root/classes" @"$root/sources.txt"
          python3 - <<'PY'
          import json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'broadcast-phase17'
          d=json.loads((root/'audit.json').read_text())
          assert d['java_sources']==1711 and len(d['modified_java'])==9
          assert d['remaining_legacy_character_broadcast_API']==0
          assert d['remaining_legacy_world_broadcast_API']==0
          assert d['raw_packets_shared']==3
          assert d['global_system_messages_shared']==2
          assert d['map_system_messages_shared']==3
          assert d['native_unchanged'] and d['no_legacy_fallback']
          with zipfile.ZipFile('downloads/RKern_Broadcast_NonSC_Phase17_FULL_SRC_20261115.zip') as z:
            assert z.testzip() is None
            assert sum(s.endswith('.java') for s in z.namelist())==1711
          print('PHASE17_VERIFIED',d['output_sha256'])
          PY
      - name: Publish validated single whole-source ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/RKern_Broadcast_NonSC_Phase17_FULL_SRC_20261115.zip
          git diff --cached --quiet && exit 0
          git commit -m "Publish phase17 compiled shared broadcast whole SRC [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
