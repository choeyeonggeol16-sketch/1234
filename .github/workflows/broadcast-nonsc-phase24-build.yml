name: Broadcast phase24 shared indun notices and raid lists
on:
  push:
    branches: [broadcast-nonsc-phase24-20261115]
    paths:
      - ".github/workflows/broadcast-nonsc-phase24-build.yml"
      - "patches/broadcast_nonsc_phase24_20261115/migrate_indun_green.py"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Migrate phase24 indun green notice fanouts
        run: |
          python3 patches/broadcast_nonsc_phase24_20261115/migrate_indun_green.py --work "$RUNNER_TEMP/broadcast-phase24"
      - name: Restore SHA256-pinned Java dependencies
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,urllib.request
          manifest=json.loads(pathlib.Path('patches/mainserver_protocol_20261114/logs/dependencies.json').read_text())
          root=pathlib.Path('.compile-deps');root.mkdir(exist_ok=True)
          for row in manifest:
            jar=root/row['file'];urllib.request.urlretrieve(row['url'],jar)
            assert hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256'],row['file']
          print('Pinned dependencies verified',len(manifest))
          PY
      - name: Full Java21 compilation, green and system wire parity and CRC
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/broadcast-phase24"
          find "$root/src" -name '*.java' | sort > "$root/sources.txt"
          test "$(wc -l < "$root/sources.txt")" -eq 1710
          mkdir -p "$root/classes" "$root/testclasses"
          javac --enable-preview --release 21 -encoding UTF-8 -J-Xmx5g -cp "$(pwd)/.compile-deps/*" -d "$root/classes" @"$root/sources.txt"
          javac --enable-preview --release 21 -encoding UTF-8 -cp "$root/classes:$(pwd)/.compile-deps/*" -d "$root/testclasses" "$root/testsrc/Phase24IndunGreenParity.java"
          java --enable-preview -cp "$root/testclasses:$root/classes:$(pwd)/.compile-deps/*" Phase24IndunGreenParity
          python3 - <<'PY'
          import json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'broadcast-phase24'
          d=json.loads((root/'audit.json').read_text())
          assert d['java_sources']==1710 and len(d['modified_java'])==7
          assert d['shared_green_indun_loops']==11 and d['raid_message_list_loops']==2
          assert d['map_object_iteration_preserved'] and d['recipient_order_and_duplicates_preserved']
          assert d['per_pc_clan_message_unchanged'] and d['no_workers_or_queues_added']
          assert d['native_unchanged'] and d['no_legacy_fallback']
          with zipfile.ZipFile('downloads/RKern_Broadcast_NonSC_Phase24_FULL_SRC_20261115.zip') as z:
            assert z.testzip() is None
            assert sum(n.endswith('.java') for n in z.namelist())==1710
          print('PHASE24_VERIFIED',d['output_sha256'])
          PY
      - name: Publish single verified whole SRC ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/RKern_Broadcast_NonSC_Phase24_FULL_SRC_20261115.zip
          git diff --cached --quiet && exit 0
          git commit -m "Publish phase24 compiled nested broadcast full source [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
