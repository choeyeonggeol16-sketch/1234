name: Broadcast phase60 callgraph and ownership audit (no source changes)
on:
  push:
    branches: [broadcast-nonsc-phase60-20261116]
    paths:
      - ".github/workflows/broadcast-nonsc-phase60-audit.yml"
      - "patches/broadcast_nonsc_phase60_20261116/classify_broadcast_entrypoints.py"
permissions:
  contents: write
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned source and classify all callsites without modifying game sources
        shell: bash
        run: |
          set -euo pipefail
          python3 patches/broadcast_nonsc_phase60_20261116/classify_broadcast_entrypoints.py
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('reports/broadcast_nonsc_phase60_20261116/SUMMARY.json')
          d=json.loads(p.read_text())
          assert d['java_sources']==1710
          assert d['production_files_changed']==0
          assert d['matched_broadcast_calls']>=744
          print('PHASE60_STATIC_INVENTORY_GATE',d['matched_broadcast_calls'],d['receiver_count'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/broadcast_nonsc_phase60_20261116
          git diff --cached --quiet || (git commit -m "Record phase60 fully enumerated broadcast receiver audit [skip ci]" && git push origin "HEAD:$GITHUB_REF_NAME")
