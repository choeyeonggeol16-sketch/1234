name: Broadcast phase21 shared tower global screen effects
on:
  push:
    branches: [broadcast-nonsc-phase21-20261115]
    paths:
      - ".github/workflows/broadcast-nonsc-phase21-build.yml"
      - "patches/broadcast_nonsc_phase21_20261115/migrate_global_display.py"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Migrate phase21 whole-source global display effects
        run: |
          python3 patches/broadcast_nonsc_phase21_20261115/migrate_global_display.py \
            --work "$RUNNER_TEMP/broadcast-phase21"
      - name: Restore pinned Java dependencies
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,urllib.request
          manifest=json.loads(pathlib.Path('patches/mainserver_protocol_20261114/logs/dependencies.json').read_text())
          root=pathlib.Path('.compile-deps')
          root.mkdir(exist_ok=True)
          for row in manifest:
            jar=root/row['file']
            urllib.request.urlretrieve(row['url'],jar)
            assert hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256'],row['file']
          print('Verified dependencies:',len(manifest))
          PY
      - name: Full Java21 compilation, global display wire parity, ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/broadcast-phase21"
          find "$root/src" -name '*.java' | sort > "$root/sources.txt"
          test "$(wc -l < "$root/sources.txt")" -eq 1710
          mkdir -p "$root/classes" "$root/testclasses"
          javac --enable-preview --release 21 -encoding UTF-8 -J-Xmx5g \
            -cp "$(pwd)/.compile-deps/*" -d "$root/classes" @"$root/sources.txt"
          javac --enable-preview --release 21 -encoding UTF-8 \
            -cp "$root/classes:$(pwd)/.compile-deps/*" \
            -d "$root/testclasses" "$root/testsrc/Phase21GlobalDisplayParity.java"
          java --enable-preview -cp "$root/testclasses:$root/classes:$(pwd)/.compile-deps/*" \
            Phase21GlobalDisplayParity
          python3 - <<'PY'
          import json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'broadcast-phase21'
          d=json.loads((root/'audit.json').read_text())
          assert d['java_sources']==1710 and len(d['modified_java'])==11
          assert d['global_display_loops_shared']==10
          assert d['private_shop_and_world_filter_preserved']
          assert d['original_iteration_order_preserved'] and d['native_unchanged']
          assert d['no_new_queues_or_threads']
          with zipfile.ZipFile('downloads/RKern_Broadcast_NonSC_Phase21_FULL_SRC_20261115.zip') as z:
            assert z.testzip() is None
            assert sum(s.endswith('.java') for s in z.namelist())==1710
          print('PHASE21_VERIFIED',d['output_sha256'])
          PY
      - name: Publish validated single whole-source ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/RKern_Broadcast_NonSC_Phase21_FULL_SRC_20261115.zip
          git diff --cached --quiet && exit 0
          git commit -m "Publish phase21 compiled shared broadcast whole SRC [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
