name: RKern critical and magic hit audit
on:
  push:
    branches:
      - rkern/nc-creature-stats-core-20261125
    paths:
      - '.github/workflows/rkern-direct-stats-migration-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: rkern/src
      - name: Enumerate critical and magic hit source readers and writers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, collections
          root=Path("rkern/src")
          lex=re.compile(r'"""[\s\S]*?"""|"(?:\\.|[^"\\])*"|\'(?:\\.|[^\'\\])*\'|//[^\n]*|/\*[\s\S]*?\*/')
          for p in sorted(root.rglob("*.java")):
              s=p.read_text(encoding="utf-8")
              clean=lex.sub(lambda m:re.sub(r'[^\n]',' ',m.group()),s)
              for i,(a,b) in enumerate(zip(s.splitlines(),clean.splitlines()),1):
                  if re.search(r'\b(?:getOriginalMagicHit|setBaseMagicHitUp|addBaseMagicHitUp|getBaseMagicHitUp|getTotalMagicHitup|setBaseMagicCritical|addBaseMagicCritical|getBaseMagicCritical|getMagicHit|addMagicHit|set_missile_critical_rate|add_missile_critical_rate|get_missile_critical_rate|set_melee_critical_rate|add_melee_critical_rate|get_melee_critical_rate|set_magic_critical_rate|add_magic_critical_rate|get_magic_critical_rate)\s*\(',b):
                      print(f"{p}:{i}: {a.strip()}")
          PY
