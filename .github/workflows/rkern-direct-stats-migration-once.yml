name: RKern base parameter reference audit
on:
  push:
    branches:
      - rkern/nc-creature-stats-core-20261125
    paths:
      - '.github/workflows/rkern-direct-stats-migration-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enumerate base ability references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pat=re.compile(r'\b(?:PcBaseAbilityCache|BaseAbility|getBaseAbility|getBaseCache|baseHitFor|m_BaseParam|resetBaseAll)\b')
          for root,ext in [('rkern/src','*.java'),('rkern/docs','*.py'),('.github/workflows','*.yml')]:
              for p in sorted(Path(root).rglob(ext)):
                  if p.name=='rkern-direct-stats-migration-once.yml': continue
                  for i,l in enumerate(p.read_text(encoding="utf-8").splitlines(),1):
                      if pat.search(l): print(f"{p}:{i}: {l.strip()}")
          PY
