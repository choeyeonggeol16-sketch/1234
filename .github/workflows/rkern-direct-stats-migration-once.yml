name: RKern base parameter migration verification
on:
  push:
    branches:
      - rkern/nc-creature-stats-core-20261125
    paths:
      - '.github/workflows/rkern-direct-stats-migration-once.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify no legacy cache or reset references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          fs=list(Path('rkern/src').rglob('*.java'))
          assert fs
          pat=re.compile(r'\b(?:PcBaseAbilityCache|BaseAbility|getBaseAbility|getBaseCache|m_BaseParam|resetBaseAll|CalcStat)\b')
          bad=[str(p) for p in fs if pat.search(p.read_text(encoding='utf-8'))]
          assert not bad,bad
          print(f"PASS {len(fs)} Java files, zero legacy base-cache references")
          PY
      - name: Verify parameter tables and stat regressions
        run: |
          for t in test_base_parameters test_calcstat_dead_mp_tables test_param_bonus_lookup test_intrinsic_stat_owner test_validate_parameters test_base_mdefend_refresh test_creature_primary_stats test_stat_lifecycle test_vital_sources; do
            python3 "rkern/docs/nc_creature_stat_audit_20261125/$t.py"
          done
