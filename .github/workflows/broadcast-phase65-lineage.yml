name: Broadcast 1–55 historical byte/CRC lineage audit
on:
  push:
    branches: [broadcast-nonsc-phase65-historical-audit-20261116]
    paths:
      - ".github/workflows/broadcast-phase65-lineage.yml"
      - "patches/broadcast_nonsc_phase65_20261116/lineage_audit_1_55.py"
permissions:
  contents: write
jobs:
  historical_crc:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Examine all 0–55 ZIP CRC, every file change and DLL SHA256
        run: |
          set -euo pipefail
          python3 patches/broadcast_nonsc_phase65_20261116/lineage_audit_1_55.py
      - name: Commit detailed historical evidence
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/broadcast_nonsc_phase65_20261116/PHASE1_55_LINEAGE.json reports/broadcast_nonsc_phase65_20261116/PHASE1_55_DELTA.txt
          git diff --cached --quiet && exit 0
          git commit -m "Audit 55 historical full-source broadcast changes [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
