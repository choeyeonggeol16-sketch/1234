name: Phase78 independently audit all SC broadcast sites
on:
  push:
    branches: [nc-assemble-broadcast-sc-final-audit-20261116]
    paths:
      - ".github/workflows/nc-sc-final-audit.yml"
      - "patches/nc_sc_final_audit_20261116/verify.py"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 patches/nc_sc_final_audit_20261116/verify.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/nc_sc_final_audit_20261116/audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish independent 195 SC broadcast path audit [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
