name: Non-SC broadcast phase5 team-map shared notice
on:
  push:
    branches: [broadcast-nonsc-phase5-20261115]
    paths:
      - ".github/workflows/broadcast-nonsc-phase5-build.yml"
      - "patches/broadcast_nonsc_phase5_20261115/migrate_team.py"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Migrate team-limited map broadcast from exact phase4 source
        run: |
          python3 patches/broadcast_nonsc_phase5_20261115/migrate_team.py \
            --work "$RUNNER_TEMP/broadcast-nonsc-phase5"
      - name: Restore checksum-pinned Java dependencies
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,urllib.request
          manifest=json.loads(pathlib.Path('patches/mainserver_protocol_20261114/logs/dependencies.json').read_text())
          root=pathlib.Path('.compile-deps')
          root.mkdir(exist_ok=True)
          for row in manifest:
            jar=root/row['file']
            urllib.request.urlretrieve(row['url'],jar)
            assert hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256'],row['file']
          print('Verified dependencies:',len(manifest))
          PY
      - name: Compile all 1711 Java sources and verify full ZIP
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/broadcast-nonsc-phase5/src" -name '*.java' | sort > "$RUNNER_TEMP/broadcast-nonsc-phase5/sources.txt"
          test "$(wc -l < "$RUNNER_TEMP/broadcast-nonsc-phase5/sources.txt")" -eq 1711
          mkdir -p "$RUNNER_TEMP/broadcast-nonsc-phase5/classes"
          javac --enable-preview --release 21 -encoding UTF-8 -J-Xmx5g \
            -cp "$(pwd)/.compile-deps/*" \
            -d "$RUNNER_TEMP/broadcast-nonsc-phase5/classes" \
            @"$RUNNER_TEMP/broadcast-nonsc-phase5/sources.txt"
          python3 - <<'PY'
          import json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'broadcast-nonsc-phase5'
          a=json.loads((root/'audit.json').read_text())
          assert a['full_java_sources']==1711 and len(a['modified_files'])==2
          assert a['team_filter_preserved'] and a['per_map_membership_preserved']
          assert a['global_round_unchanged'] and a['one_wire_per_team_notice']
          assert a['no_fallback'] and a['native_dll_unchanged']
          with zipfile.ZipFile('downloads/RKern_Broadcast_NonSC_Phase5_FULL_SRC_20261115.zip') as z:
            assert z.testzip() is None
            assert sum(x.endswith('.java') for x in z.namelist())==1711
          print('BROADCAST_NONSC_PHASE5_FULL_SRC_OK')
          print('SHA256',a['output_sha256'])
          PY
      - name: Publish validated full-source ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/RKern_Broadcast_NonSC_Phase5_FULL_SRC_20261115.zip
          git diff --cached --quiet && exit 0
          git commit -m "Publish validated phase5 team-map shared broadcast full SRC [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
