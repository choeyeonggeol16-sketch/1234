name: Shared broadcast final five production verification
on:
  push:
    branches: [mainserver-broadcast-final5-20261115]
    paths:
      - '.github/workflows/shared-broadcast-final5.yml'
      - 'patches/ctransport_broadcast_final5_20261115/**'
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply only five remaining SC broadcasters to exact latest full SRC
        run: |
          python3 patches/ctransport_broadcast_final5_20261115/build_final5.py \
            --work "$RUNNER_TEMP/final5"
      - name: Fetch and verify SHA256 pinned Java dependencies
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,urllib.request
          records=json.loads(pathlib.Path('patches/mainserver_protocol_20261114/logs/dependencies.json').read_text())
          base=pathlib.Path('.compile-deps')
          base.mkdir(exist_ok=True)
          for dep in records:
            dest=base/dep['file']
            urllib.request.urlretrieve(dep['url'],dest)
            if hashlib.sha256(dest.read_bytes()).hexdigest()!=dep['sha256']:
              raise RuntimeError('Dependency SHA256 verification failed: '+dep['file'])
          print('Verified pinned Java dependencies',len(records))
          PY
      - name: Compile all 1711 Java21 sources and run five-packet wire parity
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/final5/src" -name '*.java' | sort > "$RUNNER_TEMP/final5/sources.txt"
          test "$(wc -l < "$RUNNER_TEMP/final5/sources.txt")" -eq 1711
          mkdir -p "$RUNNER_TEMP/final5/classes" "$RUNNER_TEMP/final5/testclasses"
          javac --enable-preview --release 21 -encoding UTF-8 -J-Xmx5g \
            -cp "$(pwd)/.compile-deps/*" -d "$RUNNER_TEMP/final5/classes" \
            @"$RUNNER_TEMP/final5/sources.txt"
          javac --enable-preview --release 21 -encoding UTF-8 \
            -cp "$RUNNER_TEMP/final5/classes:$(pwd)/.compile-deps/*" \
            -d "$RUNNER_TEMP/final5/testclasses" \
            "$RUNNER_TEMP/final5/testsrc/l1j/server/server/model/network/core/sc/packet/SharedFinalFiveWireParity.java"
          java --enable-preview \
            -cp "$RUNNER_TEMP/final5/testclasses:$RUNNER_TEMP/final5/classes:$(pwd)/.compile-deps/*" \
            l1j.server.server.model.network.core.sc.packet.SharedFinalFiveWireParity
          python3 - <<'PY'
          import os,json,pathlib,zipfile
          work=pathlib.Path(os.environ['RUNNER_TEMP'])/'final5'
          report=json.loads((work/'audit.json').read_text())
          assert report['new_shared_packet_classes']==5
          assert report['full_src_java_count']==1711
          assert report['ground_item_known_object_updates_only_after_confirmed_SEND']
          assert not report['native_dll_changed'] and not report['socket_fifo_policy_changed']
          with zipfile.ZipFile('downloads/CTransport_SharedBroadcast_FinalFive_FULL_SRC_20261115.zip') as z:
            assert z.testzip() is None
            assert sum(x.endswith('.java') for x in z.namelist())==1711
          print('PASS: remaining five broadcast handlers; 1711 Java21 full compile; wire tests; CRC')
          print('Changed Java files:',report['changed_java_count'])
          PY
      - name: Publish one verified full source ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/CTransport_SharedBroadcast_FinalFive_FULL_SRC_20261115.zip
          git diff --cached --quiet && { echo "Already published"; exit 0; }
          git commit -m "Publish validated final-five shared broadcast complete source [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
