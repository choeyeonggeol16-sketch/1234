name: JProRing Linux loopback benchmark

on:
  push:
    branches:
      - rkern/jproring-linux-benchmark-20261120
      - rkern/jproring-audit-fixes-20261120
    paths:
      - .github/workflows/jproring-linux-benchmark.yml
      - rkern/docs/jproring_linux_benchmark_20261120/*.java
      - rkern/docs/jproring_linux_benchmark_20261120/run.py
      - rkern/src/l1j/server/server/model/network/**
      - rkern/src/l1j/server/Server.java
      - rkern/docs/jproring_cio_integration_20261120/GameSendBenchmark.java
      - rkern/docs/jproring_cio_integration_20261120/run_game_ab.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            rkern/src
            rkern/docs/jproring_cio_integration_20261120
            rkern/docs/jproring_selector_transport_20261120
            rkern/docs/jproring_linux_benchmark_20261120
      - name: Run Linux transport benchmark or audit smoke test
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          benchmark=rkern/docs/jproring_linux_benchmark_20261120/run.py
          if [[ "$GITHUB_REF_NAME" == rkern/jproring-audit-fixes-* ]]; then
            python3 -u "$benchmark" --framed --owners 2 --workload persistent --clients 16 \
              --window 8 --payload-bytes 256 --trials 1 --warmup-ms 200 --measure-ms 350 \
              --output "$RUNNER_TEMP/benchmark"
          else
            python3 -u "$benchmark" --workload churn --output "$RUNNER_TEMP/benchmark"
          fi
      - name: Verify real game listener burst and capture server metrics
        if: github.ref_name == 'rkern/jproring-audit-fixes-20261120'
        run: |
          export PATH="$JAVA_HOME_21_X64/bin:$PATH"
          python3 -u rkern/docs/jproring_cio_integration_20261120/run_game_ab.py --mode off --workload burst \
            --trials 1 --warmup-ms 300 --measure-ms 550 --output "$RUNNER_TEMP/benchmark/game"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tcp-transport-results
          path: ${{ runner.temp }}/benchmark
          if-no-files-found: ignore
