name: CTransport Windows native and Java FFM
on:
  push:
    branches: [ctransport-core-20261112, ctransport-shared-abi10-20261113]
    paths:
      - '.github/workflows/ctransport-windows.yml'
      - 'patches/ctransport_core_20261112/native/**'
      - 'patches/ctransport_core_20261112/src/**'
      - 'patches/ctransport_core_20261112/tests/**'
      - 'patches/ctransport_core_20261112/build/**'
permissions:
  contents: read
jobs:
  actual-windows:
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: patches/ctransport_core_20261112
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build or verify the MSVC object ABI and DLL
        shell: pwsh
        working-directory: patches/ctransport_core_20261112
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 toolchain missing' }
          $dev = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          & cmd /s /c "`"$dev`" -arch=x64 -host_arch=x64 && python native/build_native_msvc.py --reuse"
          if ($LASTEXITCODE -ne 0) { throw 'MSVC ABI build/test failed' }
      - name: Run shipped DLL and production FFM/PSS adapters
        shell: pwsh
        working-directory: patches/ctransport_core_20261112
        run: ./tests/run_windows.ps1
      - name: Upload the exact tested MSVC binaries and Java pin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctransport-msvc-tested
          path: |
            patches/ctransport_core_20261112/build/CTransport.dll
            patches/ctransport_core_20261112/build/CTransport.lib
            patches/ctransport_core_20261112/build/CTransport_SelfTest.exe
            patches/ctransport_core_20261112/build/ObjectAbiTest.exe
            patches/ctransport_core_20261112/build/native-build.json
            patches/ctransport_core_20261112/src/l1j/server/server/model/network/core/config/CIOConfig.java
            patches/ctransport_core_20261112/logs/object-memory-*.log
      - name: Publish tested binaries to a run-specific review branch
        if: success() && github.ref_name == 'ctransport-shared-abi10-20261113'
        shell: pwsh
        working-directory: patches/ctransport_core_20261112
        run: |
          @{ source_commit=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID; dll_sha256=(Get-FileHash build/CTransport.dll -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content -Encoding UTF8 build/msvc-ci-artifact.json
          git add build/CTransport.dll build/CTransport.lib build/CTransport_SelfTest.exe build/ObjectAbiTest.exe build/native-build.json build/msvc-ci-artifact.json src/l1j/server/server/model/network/core/config/CIOConfig.java
          git add logs/object-memory-*.log
          git -c user.name=Codex -c user.email=codex@openai.com commit -m "Publish tested MSVC artifacts from run $env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Tested artifact commit failed' }
          git push origin "HEAD:refs/heads/ctransport-msvc-tested-$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Tested artifact publication failed' }
