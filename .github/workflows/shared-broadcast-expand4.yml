name: Shared broadcast expansion phase 4
on:
  push:
    branches: [mainserver-broadcast-expand4-20261115]
    paths:
      - '.github/workflows/shared-broadcast-expand4.yml'
      - 'patches/ctransport_broadcast_expand4_20261115/**'
permissions:
  contents: write
jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Migrate six AOI packet classes from exact latest 32-class full SRC
        run: |
          python3 patches/ctransport_broadcast_expand4_20261115/expand4.py \
            --work "$RUNNER_TEMP/phase4"
      - name: Fetch SHA256-pinned Java dependencies
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          rows=json.loads(pathlib.Path('patches/mainserver_protocol_20261114/logs/dependencies.json').read_text())
          dst=pathlib.Path('.compile-deps')
          dst.mkdir(exist_ok=True)
          for row in rows:
            jar=dst/row['file']
            urllib.request.urlretrieve(row['url'],jar)
            assert hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256'],row['file']
          print('Verified SHA256:',len(rows),'dependencies')
          PY
      - name: Compile complete Java21 source and test shared/direct wire parity
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/phase4/src" -name '*.java' | sort > "$RUNNER_TEMP/phase4/java.txt"
          test "$(wc -l < "$RUNNER_TEMP/phase4/java.txt")" -eq 1711
          mkdir -p "$RUNNER_TEMP/phase4/classes" "$RUNNER_TEMP/phase4/testclasses"
          javac --enable-preview --release 21 -encoding UTF-8 -J-Xmx5g \
            -cp "$(pwd)/.compile-deps/*" \
            -d "$RUNNER_TEMP/phase4/classes" @"$RUNNER_TEMP/phase4/java.txt"
          javac --enable-preview --release 21 -encoding UTF-8 \
            -cp "$RUNNER_TEMP/phase4/classes:$(pwd)/.compile-deps/*" \
            -d "$RUNNER_TEMP/phase4/testclasses" \
            "$RUNNER_TEMP/phase4/testsrc/SharedBroadcastWireParity4.java"
          java --enable-preview \
            -cp "$RUNNER_TEMP/phase4/testclasses:$RUNNER_TEMP/phase4/classes:$(pwd)/.compile-deps/*" \
            SharedBroadcastWireParity4
          python3 - <<'PY'
          import json, os, pathlib, zipfile
          d=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'phase4/audit.json').read_text())
          assert d['new_shared_count']==6 and d['total_shared_classes']==38
          assert d['java_files']==1711 and d['native_dll_unchanged']
          with zipfile.ZipFile('downloads/CTransport_SharedBroadcast_38Packet_FULL_SRC_20261115.zip') as z:
            assert z.testzip() is None
            assert sum(x.endswith('.java') for x in z.namelist())==1711
          print('PASS: phase4 38 shared packet classes, 1711 Java21 compile, wire parity, ZIP CRC')
          print('Unconverted classes:',d['remaining_count'])
          print('Unconverted names:',','.join(d['remaining_classes']))
          PY
      - name: Publish only successfully compiled full SRC ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/CTransport_SharedBroadcast_38Packet_FULL_SRC_20261115.zip
          git diff --cached --quiet && { echo "Already published"; exit 0; }
          git commit -m "Publish shared broadcast 38-class Java21 validated full source [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
