name: Non-SC broadcast phase6 immutable display fanout
on:
  push:
    branches: [broadcast-nonsc-phase6-20261115]
    paths:
      - ".github/workflows/broadcast-nonsc-phase6-build.yml"
      - "patches/broadcast_nonsc_phase6_20261115/migrate_effects.py"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Migrate from checksum-pinned phase5 whole SRC
        run: |
          python3 patches/broadcast_nonsc_phase6_20261115/migrate_effects.py \
            --work "$RUNNER_TEMP/broadcast-nonsc-phase6"
      - name: Restore checksum-pinned Java dependencies
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,urllib.request
          manifest=json.loads(pathlib.Path('patches/mainserver_protocol_20261114/logs/dependencies.json').read_text())
          root=pathlib.Path('.compile-deps')
          root.mkdir(exist_ok=True)
          for row in manifest:
            jar=root/row['file']
            urllib.request.urlretrieve(row['url'],jar)
            assert hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256'],row['file']
          print('Verified dependencies:',len(manifest))
          PY
      - name: Full Java21 compilation and 8192 packet parity assertions
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/broadcast-nonsc-phase6"
          find "$root/src" -name '*.java' | sort > "$root/sources.txt"
          test "$(wc -l < "$root/sources.txt")" -eq 1711
          mkdir -p "$root/classes" "$root/testclasses"
          javac --enable-preview --release 21 -encoding UTF-8 -J-Xmx5g \
            -cp "$(pwd)/.compile-deps/*" \
            -d "$root/classes" @"$root/sources.txt"
          javac --enable-preview --release 21 -encoding UTF-8 \
            -cp "$root/classes:$(pwd)/.compile-deps/*" \
            -d "$root/testclasses" "$root/testsrc/DisplayEffectSharedParity.java"
          java --enable-preview -cp "$root/testclasses:$root/classes:$(pwd)/.compile-deps/*" \
            DisplayEffectSharedParity
          python3 - <<'PY'
          import json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'broadcast-nonsc-phase6'
          d=json.loads((root/'audit.json').read_text())
          assert len(d['modified_files'])==3 and d['full_java_sources']==1711
          assert d['encoded_once_per_effect'] and d['recipient_major_order_preserved']
          assert d['team_filter_preserved'] and d['map_membership_preserved']
          assert d['no_fallback'] and d['native_dll_unchanged']
          with zipfile.ZipFile('downloads/RKern_Broadcast_NonSC_Phase6_FULL_SRC_20261115.zip') as z:
            assert z.testzip() is None
            assert sum(n.endswith('.java') for n in z.namelist())==1711
          print('BROADCAST_NONSC_PHASE6_VERIFIED', d['output_sha256'])
          PY
      - name: Publish verified whole-source ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/RKern_Broadcast_NonSC_Phase6_FULL_SRC_20261115.zip
          git diff --cached --quiet && exit 0
          git commit -m "Publish validated phase6 display effect shared broadcast full SRC [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
