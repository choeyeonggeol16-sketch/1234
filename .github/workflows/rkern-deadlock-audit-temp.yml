name: RKern temporary deadlock audit
on:
  push:
    branches: [rkern/nc-intrusive-inventory-20261122]
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scan all production Java lock, trade, and blocking call sites
        run: |
          python3 - <<'PY'
          import pathlib,re,collections
          root=pathlib.Path('rkern/src')
          files=list(root.rglob('*.java'))
          print('JAVA_COUNT',len(files))
          for tag,pattern,limit in [
          ('TRADE',r'\btradeItem\s*\(',350),
          ('GROUND_CALL',r'(getInventory|findGroundInventory)\s*\(',200),
          ('LOCK',r'\bsynchronized\s*\(',450),
          ('BLOCK',r'(\.join\s*\(|\.await\s*\(|\.get\s*\(\s*(?:[0-9a-zA-Z_]+\s*,)?\s*\)|\.wait\s*\(|LockSupport\.(?:park|parkNanos)|Thread\.sleep\s*\(|\.lock\s*\(|\.lockInterruptibly\s*\(|\.take\s*\(|\.put\s*\()',200),
          ]:
           print('===',tag)
           n=0
           for p in files:
            lines=p.read_text(errors='replace').splitlines()
            for i,line in enumerate(lines,1):
             if re.search(pattern,line) and not line.lstrip().startswith(('*','//')):
              if tag=='LOCK' and not any(q in str(p) for q in ['/model/','/storage/','/network/','/Controller/','/datatables/']):continue
              if tag=='GROUND_CALL' and not any(q in line for q in ['L1World','ground','Ground','getInventory(x, y','getInventory(p','getInventory(npc','getInventory(item','findGround']):continue
              if tag=='TRADE' and not ('.tradeItem' in line or ' tradeItem' in line):continue
              print(f'{tag} {p}:{i}: {line.strip()[:170]}')
              n+=1
              if n>=limit:break
            if n>=limit:break
           print('COUNT_PRINTED',tag,n)
          
          PY
      - name: Set up Java 21 for AST full-code and lock stress checks
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Parse all Java source and inspect nested lock acquisition AST
        run: |
          cat > /tmp/RKernLockAudit.java <<'JAVA'
          import java.util.*;
          import java.nio.file.*;
          import javax.tools.*;
          import com.sun.source.tree.*;
          import com.sun.source.util.*;
          
          public class RKernLockAudit {
           static int parsed=0,errors=0,lockPairs=0,blocking=0;
           static final Map<String,Integer> pairs=new TreeMap<>();
           static final ArrayList<String> examples=new ArrayList<>();
           static class Visitor extends TreePathScanner<Void,Void> {
            final CompilationUnitTree cu;
            final Trees trees;
            final Deque<String> held=new ArrayDeque<>();
            final String path;
            Visitor(CompilationUnitTree cu,Trees trees) {
             this.cu=cu;this.trees=trees;
             this.path=Paths.get(cu.getSourceFile().toUri()).toString();
            }
            int line(Tree node) {
             long pos=trees.getSourcePositions().getStartPosition(cu,node);
             return pos<0 ? -1 : (int) cu.getLineMap().getLineNumber(pos);
            }
            void enter(String key,Tree node) {
             for(String owner:held) {
              lockPairs++;
              String pair=owner+" -> "+key;
              pairs.merge(pair,1,Integer::sum);
              if(examples.size()<500 && (path.contains("Inventory") || path.contains("Warehouse") ||
                 path.contains("CWorld") || path.contains("CacheD") || path.contains("ThreadCallback") ||
                 path.contains("Action")))examples.add("NEST "+path+":"+line(node)+" "+pair);
             }
             held.push(key);
            }
            @Override public Void visitMethod(MethodTree node,Void p) {
             if(node.getModifiers().getFlags().contains(javax.lang.model.element.Modifier.SYNCHRONIZED)) {
              enter(node.getModifiers().getFlags().contains(javax.lang.model.element.Modifier.STATIC)?"<class>":"this",node);
              try {return super.visitMethod(node,p);} finally{held.pop();}
             }
             return super.visitMethod(node,p);
            }
            @Override public Void visitSynchronized(SynchronizedTree node,Void p) {
             String key=node.getExpression().toString().replace("(","").replace(")","").trim();
             enter(key,node);
             try {return super.visitSynchronized(node,p);} finally{held.pop();}
            }
            @Override public Void visitMethodInvocation(MethodInvocationTree node,Void p) {
             if(!held.isEmpty()) {
              String call=node.getMethodSelect().toString();
              if(call.matches(".*[.](wait|join|await|take|lock|lockInterruptibly|sleep|park|parkNanos)$")) {
                blocking++;
                if(examples.size()<650)examples.add("BLOCK_IN_LOCK "+path+":"+line(node)+" "+held+" "+call);
              }
             }
             return super.visitMethodInvocation(node,p);
            }
           }
           public static void main(String[] args)throws Exception{
            List<Path> javaFiles;
            try(var stream=Files.walk(Paths.get("rkern/src"))) {javaFiles=stream.filter(p->p.toString().endsWith(".java")).toList();}
            JavaCompiler compiler=ToolProvider.getSystemJavaCompiler();
            var errorsList=new ArrayList<String>();
            DiagnosticCollector<JavaFileObject> diagnostics=new DiagnosticCollector<>();
            try(StandardJavaFileManager fm=compiler.getStandardFileManager(diagnostics,null,null)) {
             for(int offset=0;offset<javaFiles.size();offset+=72){
              List<Path> batch=javaFiles.subList(offset,Math.min(offset+72,javaFiles.size()));
              var units=fm.getJavaFileObjectsFromPaths(batch);
              var task=(JavacTask)compiler.getTask(null,fm,diagnostics,List.of("-proc:none","--release","21"),null,units);
              var trees=Trees.instance(task);
              for(var unit:task.parse()){
                parsed++;
                new Visitor(unit,trees).scan(unit,null);
              }
             }
            }
            for(var d:diagnostics.getDiagnostics())if(d.getKind()==Diagnostic.Kind.ERROR) {
             errors++;
             if(errors<15)errorsList.add(d.toString());
            }
            System.out.println("AUDIT parsed="+parsed+" syntax_errors="+errors+" nested_lock_pairs="+lockPairs+" blocking_in_lock="+blocking);
            for(var e:pairs.entrySet())if(e.getValue()>=2)System.out.println("LOCK_PAIR "+e.getValue()+" "+e.getKey());
            for(int i=0;i<Math.min(180,examples.size());i++)System.out.println(examples.get(i));
            for(String s:errorsList)System.out.println("ERROR "+s);
            if(errors>0 || parsed!=javaFiles.size())System.exit(1);
           }
          }
          
          JAVA
          javac /tmp/RKernLockAudit.java
          java -Xmx2g -cp /tmp RKernLockAudit
      - name: Compile extracted production inventory ordering and stress concurrency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('rkern/src/l1j/server/server/model/L1Inventory.java').read_text()
          g=Path('rkern/src/l1j/server/server/model/L1GroundInventory.java').read_text()
          assert 'public synchronized void deleteItem(L1ItemInstance item)' in g
          assert re.search(r'public synchronized void deleteItem\(L1ItemInstance item\)[\s\S]{0,190}synchronized \(item\)',g)
          assert 'public synchronized L1ItemInstance tradeItem(L1ItemInstance item, int count, L1Inventory inventory)' not in s
          assert 'public synchronized L1ItemInstance tradeItem(int objectId, int count, L1Inventory inventory)' not in s
          start=s.index('    public L1ItemInstance tradeItem(L1ItemInstance item, int count, L1Inventory inventory) {')
          end=s.index('    /** Both owner monitors must be held before any ownership/count mutation. */',start)
          src=s[start:end]
          assert 'synchronized (first)' in src and 'synchronized (second)' in src
          java='''import java.util.concurrent.*;
          import java.util.concurrent.atomic.*;
          class L1ItemInstance {}
          class L1Inventory {
              static final AtomicInteger calls = new AtomicInteger();
              private static final Object ITEM_TRANSFER_TIE_LOCK = new Object();
          ''' + src + '''
              private L1ItemInstance tradeItemLocked(L1ItemInstance item,int count,L1Inventory inventory) {
                 if (!Thread.holdsLock(this)||!Thread.holdsLock(inventory))
                     throw new AssertionError("both inventories must be locked");
                 if ((calls.incrementAndGet() & 127)==0) Thread.yield();
                 return item;
              }
          }
          class L1GroundInventory extends L1Inventory {}
          public class LockOrderProbe {
            public static void main(String[] args)throws Exception {
              L1Inventory ground=new L1GroundInventory(),pc=new L1Inventory(),
                          a=new L1Inventory(),b=new L1Inventory(),npc=new L1Inventory();
              L1ItemInstance item=new L1ItemInstance();
              ExecutorService ex=Executors.newFixedThreadPool(16);
              CountDownLatch go=new CountDownLatch(1);
              Future<?>[] tasks=new Future<?>[16];
              for(int t=0;t<tasks.length;t++){
                final int id=t;
                tasks[t]=ex.submit(()-> {
                  try {
                    go.await();
                    for(int i=0;i<1200;i++){
                      int mode=(i+id)%6;
                      L1Inventory left=(mode==0?pc:mode==1?ground:mode==2?a:mode==3?b:mode==4?npc:ground);
                      L1Inventory right=(mode==0?ground:mode==1?pc:mode==2?b:mode==3?a:mode==4?ground:npc);
                      if(left.tradeItem(item,1,right)!=item)throw new AssertionError("transfer failed");
                    }
                  } catch(InterruptedException e){Thread.currentThread().interrupt();throw new RuntimeException(e);}
                });
              }
              go.countDown();
              for(Future<?> task:tasks)task.get(25,TimeUnit.SECONDS);
              ex.shutdownNow();
              if(L1Inventory.calls.get()!=19200)throw new AssertionError("lost calls");
              System.out.println("LOCK_STRESS PASS paired transfers="+L1Inventory.calls.get()+
                " bidirectional ground<->pc, ground<->npc, pc<->pc threads=16");
            }
          }
          '''.replace('ground<->pc','ground-to-pc').replace('ground<->npc','ground-to-npc').replace('pc<->pc','pc-to-pc')
          Path('/tmp/LockOrderProbe.java').write_text(java)
          print('LOCK_PROBE extracted_source_lines',len(src.splitlines()))
          
          PY
          javac /tmp/LockOrderProbe.java
          java -cp /tmp LockOrderProbe
