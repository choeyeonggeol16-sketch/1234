name: Non-SC broadcast phase4 GM shared notice
on:
  push:
    branches: [broadcast-nonsc-phase4-20261115]
    paths:
      - ".github/workflows/broadcast-nonsc-phase4-build.yml"
      - "patches/broadcast_nonsc_phase4_20261115/migrate_gm.py"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Migrate one verified GM-only broadcast from exact phase3 source
        run: |
          python3 patches/broadcast_nonsc_phase4_20261115/migrate_gm.py \
            --work "$RUNNER_TEMP/broadcast-nonsc-phase4"
      - name: Restore checksum-pinned Java dependencies
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,urllib.request
          manifest=json.loads(pathlib.Path('patches/mainserver_protocol_20261114/logs/dependencies.json').read_text())
          root=pathlib.Path('.compile-deps')
          root.mkdir(exist_ok=True)
          for row in manifest:
            jar=root/row['file']
            urllib.request.urlretrieve(row['url'],jar)
            assert hashlib.sha256(jar.read_bytes()).hexdigest()==row['sha256'],row['file']
          print('Verified dependencies:',len(manifest))
          PY
      - name: Full Java 21 compile and archive regression
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/broadcast-nonsc-phase4/src" -name '*.java' | sort > "$RUNNER_TEMP/broadcast-nonsc-phase4/sources.txt"
          test "$(wc -l < "$RUNNER_TEMP/broadcast-nonsc-phase4/sources.txt")" -eq 1711
          mkdir -p "$RUNNER_TEMP/broadcast-nonsc-phase4/classes"
          javac --enable-preview --release 21 -encoding UTF-8 -J-Xmx5g \
            -cp "$(pwd)/.compile-deps/*" \
            -d "$RUNNER_TEMP/broadcast-nonsc-phase4/classes" \
            @"$RUNNER_TEMP/broadcast-nonsc-phase4/sources.txt"
          python3 - <<'PY'
          import json,os,pathlib,zipfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'broadcast-nonsc-phase4'
          data=json.loads((root/'audit.json').read_text(encoding='utf8'))
          assert data['full_java_sources']==1711
          assert len(data['modified_java_files'])==2
          assert data['gm_filter_preserved'] and data['world_traversal_order_preserved']
          assert data['one_shared_system_message_wire'] and data['no_fallback']
          assert data['native_dll_unchanged']
          with zipfile.ZipFile('downloads/RKern_Broadcast_NonSC_Phase4_FULL_SRC_20261115.zip') as z:
            assert z.testzip() is None
            assert sum(x.endswith('.java') for x in z.namelist())==1711
          print('BROADCAST_NONSC_PHASE4_FULL_SRC_OK')
          print('SHA256',data['output_sha256'])
          PY
      - name: Publish one validated full-source ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/RKern_Broadcast_NonSC_Phase4_FULL_SRC_20261115.zip
          git diff --cached --quiet && exit 0
          git commit -m "Publish validated phase4 shared GM broadcast full SRC [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
