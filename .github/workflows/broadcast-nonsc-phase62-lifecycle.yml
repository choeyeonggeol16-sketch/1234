name: Broadcast phase62 shared-fanout & native-source lifetime stress
on:
  push:
    branches: [broadcast-nonsc-phase62-verify-20261116]
    paths:
      - ".github/workflows/broadcast-nonsc-phase62-lifecycle.yml"
      - "patches/broadcast_nonsc_phase62_20261116/verify_lifecycle_harness.py"
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile the actual shared Java source with isolated transport/world stubs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/phase62-lifecycle"
          python3 patches/broadcast_nonsc_phase62_20261116/verify_lifecycle_harness.py "$root"
          mkdir -p "$root/classes"
          find "$root/src" -name '*.java' | sort > "$root/sources.txt"
          javac --enable-preview --release 21 -encoding UTF-8 -d "$root/classes" @"$root/sources.txt"
          java --enable-preview -cp "$root/classes" SharedBroadcastLifecycleTest
