name: Inventory creation caller migration
on: [push]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rkern/nc-inventory-lookup-20261125
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Migrate inventory calls only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f34a19d24915bbad912564eae08493cb8d9f8a9f"
          python3 - <<'PY'
          import pathlib,re,collections
          root=pathlib.Path('rkern/src')
          files=list(root.rglob('*.java'))
          assert len(files)==1824
          lex=re.compile(r'//[^\r\n]*|/\*[\s\S]*?\*/|"""[\s\S]*?"""|"(?:\\.|[^"\\\r\n])*"|\'(?:\\.|[^\'\\\r\n])*\'|[A-Za-z_$][A-Za-z0-9_$]*|::|[^\s]')
          counts=collections.Counter()
          changed=[]
          storage_refs=[]
          for p in files:
              raw=p.read_bytes();s=raw.decode('utf-8-sig')
              bom=raw.startswith(b'\xef\xbb\xbf')
              ts=[m for m in lex.finditer(s) if not m.group().startswith(('//','/*','"',"'" ))]
              edits=[]
              for i,t in enumerate(ts):
                  n=t.group()
                  if n not in ('storeItem','storeItemTrea'):continue
                  nxt=ts[i+1].group() if i+1<len(ts) else ''
                  prv=ts[i-1].group() if i else ''
                  if nxt!='(' and prv!='::':continue
                  before=[x.group() for x in ts[max(0,i-6):i]]
                  storage=(n=='storeItem' and (
                      (p.name in ('CharactersItemStorage.java','CacheD.java','MySqlCharactersItemStorage.java') and prv=='void')
                      or before[-2:]==['storage','.']
                      or before[-6:]==['CharactersItemStorage','.','create','(',')','.']
                      or before[-6:]==['CacheD','.','getInstance','(',')','.']))
                  if storage:
                      storage_refs.append((str(p),s.count('\n',0,t.start())+1))
                      continue
                  dest='CreateOrAddItem' if n=='storeItem' else 'AddTreasureItemToInventory'
                  edits.append((t.start(),t.end(),dest));counts[n]+=1
              for a,b,d in reversed(edits):s=s[:a]+d+s[b:]
              if edits:
                  p.write_bytes((b'\xef\xbb\xbf' if bom else b'')+s.encode('utf-8'));changed.append(str(p))
          print('RENAMED',dict(counts),'FILES',len(changed))
          print('STORAGE_PRESERVED',storage_refs)
          assert len(storage_refs)==7,storage_refs
          assert counts['storeItem']>=120 and counts['storeItemTrea']==1,counts
          for p in files:
              s=p.read_text(encoding='utf-8-sig')
              tokens=[m.group() for m in lex.finditer(s) if not m.group().startswith(('//','/*','"',"'" ))]
              if 'storeItemTrea' in tokens:raise AssertionError(str(p))
              # All remaining invocations/declarations belong to the storage layer.
              for i,n in enumerate(tokens):
                  if n!='storeItem':continue
                  if tokens[i+1]!='(' and tokens[i-1]!='::':continue
                  before=tokens[max(0,i-6):i]
                  assert ((p.name in ('CharactersItemStorage.java','CacheD.java','MySqlCharactersItemStorage.java') and tokens[i-1]=='void')
                      or before[-2:]==['storage','.']
                      or before[-6:]==['CharactersItemStorage','.','create','(',')','.']
                      or before[-6:]==['CacheD','.','getInstance','(',')','.']),str(p)
          pathlib.Path('/tmp/create-rename-files.txt').write_text('\n'.join(changed)+'\n')
          print('REFERENCE_SCAN_OK')
          
          PY
          cat >/tmp/ParseInventory.java <<'JAVA'
          import javax.tools.*;
          import com.sun.source.util.JavacTask;
          import java.util.*;
          import java.nio.file.*;
          public class ParseInventory {
            public static void main(String[] args)throws Exception{
              var paths=Files.readAllLines(Path.of(args[0]));
              var c=ToolProvider.getSystemJavaCompiler();var d=new DiagnosticCollector<JavaFileObject>();
              try(var f=c.getStandardFileManager(d,null,java.nio.charset.StandardCharsets.UTF_8)){
                var t=(JavacTask)c.getTask(null,f,d,List.of("-proc:none","--release","21"),null,f.getJavaFileObjectsFromStrings(paths));
                int n=0;for(var u:t.parse())n++;
                long errors=d.getDiagnostics().stream().filter(x->x.getKind()==Diagnostic.Kind.ERROR).count();
                System.out.println("PARSE_FILES "+n+" ERRORS "+errors);
                if(errors!=0||n!=paths.size()){d.getDiagnostics().forEach(System.out::println);System.exit(1);}
              }
            }
          }
          JAVA
          java /tmp/ParseInventory.java /tmp/create-rename-files.txt
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rkern/src
          git commit -m 'refactor(inventory): migrate reward callers to CreateOrAddItem'
          git push origin HEAD:refs/heads/rkern/nc-inventory-lookup-20261125
